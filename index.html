<script>

/* =========================================
   STORAGE
========================================= */

const STORAGE_KEY =
    "poribarHisabFinalV2";


let families = [];


/* =========================================
   ELEMENTS
========================================= */

const tableBody =
    document.getElementById(
        "familyTableBody"
    );

const totalFamilies =
    document.getElementById(
        "totalFamilies"
    );

const totalMembers =
    document.getElementById(
        "totalMembers"
    );

const backupBtn =
    document.getElementById(
        "backupBtn"
    );

const restoreBtn =
    document.getElementById(
        "restoreBtn"
    );

const restoreFile =
    document.getElementById(
        "restoreFile"
    );

const clearBtn =
    document.getElementById(
        "clearBtn"
    );


/* =========================================
   BANGLA NUMBER → ENGLISH NUMBER
========================================= */

function toEnglishNumbers(value){

    const bangla =
        "০১২৩৪৫৬৭৮৯";

    const english =
        "0123456789";

    let result = "";

    value =
        String(value || "");


    for(
        let i = 0;
        i < value.length;
        i++
    ){

        const ch =
            value.charAt(i);

        const position =
            bangla.indexOf(ch);


        if(position >= 0){

            result +=
                english.charAt(
                    position
                );

        }
        else if(
            english.indexOf(ch) >= 0
        ){

            result += ch;

        }

    }


    return result;

}


/* =========================================
   SAVE DATA
========================================= */

function saveData(){

    try{

        localStorage.setItem(
            STORAGE_KEY,
            JSON.stringify(families)
        );

    }
    catch(error){

        console.log(
            "Save error:",
            error
        );

    }

}


/* =========================================
   LOAD DATA
========================================= */

function loadData(){

    let saved = null;


    try{

        saved =
            localStorage.getItem(
                STORAGE_KEY
            );


        if(!saved){

            saved =
                localStorage.getItem(
                    "poribarHisabFinalV1"
                );

        }


        if(!saved){

            saved =
                localStorage.getItem(
                    "poribarHisabSimpleV2"
                );

        }


        if(!saved){

            families = [];

            return;

        }


        const data =
            JSON.parse(saved);


        if(!Array.isArray(data)){

            families = [];

            return;

        }


        families =
            data

            .map(function(item){

                return {

                    name:
                        String(
                            item.name || ""
                        ),

                    members:
                        toEnglishNumbers(
                            item.members || ""
                        )

                };

            })


            .filter(function(item){

                return (
                    item.name.trim() !== ""
                );

            });

    }
    catch(error){

        console.log(
            "Load error:",
            error
        );

        families = [];

    }

}


/* =========================================
   UPDATE SUMMARY
========================================= */

function updateSummary(){

    let memberTotal = 0;


    families.forEach(
        function(item){

            const number =
                parseInt(
                    toEnglishNumbers(
                        item.members
                    ),
                    10
                );


            if(!isNaN(number)){

                memberTotal += number;

            }

        }
    );


    totalFamilies.textContent =
        families.length.toLocaleString(
            "bn-BD"
        );


    totalMembers.textContent =
        memberTotal.toLocaleString(
            "bn-BD"
        );

}


/* =========================================
   FOCUS INPUT
========================================= */

function focusInput(input){

    if(!input){

        return;

    }


    requestAnimationFrame(
        function(){

            input.focus();


            try{

                input.setSelectionRange(
                    input.value.length,
                    input.value.length
                );

            }
            catch(error){}

        }
    );

}


/* =========================================
   CREATE INPUT
========================================= */

function createInput(
    className,
    value,
    placeholder
){

    const input =
        document.createElement(
            "input"
        );


    input.type = "text";

    input.className =
        className;

    input.value =
        value || "";

    input.placeholder =
        placeholder;

    input.autocomplete =
        "off";

    input.autocorrect =
        "off";

    input.autocapitalize =
        "sentences";

    input.spellcheck =
        false;


    input.enterKeyHint =
        className === "family-input"
        ? "next"
        : "done";


    return input;

}


/* =========================================
   RENDER
========================================= */

function render(){

    tableBody.innerHTML = "";


    families.forEach(
        function(family,index){

            const tr =
                document.createElement(
                    "tr"
                );


            /* FAMILY NAME */

            const familyTd =
                document.createElement(
                    "td"
                );


            const familyInput =
                createInput(
                    "family-input",
                    family.name,
                    "পরিবারের নাম"
                );


            familyInput.addEventListener(
                "input",
                function(){

                    families[index].name =
                        this.value;

                    saveData();

                }
            );


            familyInput.addEventListener(
                "keydown",
                function(event){

                    if(
                        event.key ===
                        "Enter"
                    ){

                        event.preventDefault();

                        event.stopPropagation();


                        const memberInput =
                            tr.querySelector(
                                ".member-input"
                            );


                        focusInput(
                            memberInput
                        );

                    }

                }
            );


            familyTd.appendChild(
                familyInput
            );


            /* MEMBER COUNT */

            const memberTd =
                document.createElement(
                    "td"
                );


            const memberInput =
                createInput(
                    "member-input",
                    family.members,
                    "সংখ্যা"
                );


            memberInput.addEventListener(
                "input",
                function(){

                    families[index].members =
                        this.value;

                    saveData();

                }
            );


            memberInput.addEventListener(
                "keydown",
                function(event){

                    if(
                        event.key ===
                        "Enter"
                    ){

                        event.preventDefault();

                        event.stopPropagation();


                        families[index].members =
                            toEnglishNumbers(
                                this.value
                            );


                        this.value =
                            families[index].members;


                        saveData();

                        updateSummary();

                        createNextFamily();

                    }

                }
            );


            memberTd.appendChild(
                memberInput
            );


            /* DELETE */

            const actionTd =
                document.createElement(
                    "td"
                );


            const deleteBtn =
                document.createElement(
                    "button"
                );


            deleteBtn.type =
                "button";

            deleteBtn.className =
                "delete-btn";

            deleteBtn.textContent =
                "মুছুন";


            deleteBtn.addEventListener(
                "click",
                function(){

                    families.splice(
                        index,
                        1
                    );


                    saveData();

                    render();

                }
            );


            actionTd.appendChild(
                deleteBtn
            );


            tr.appendChild(
                familyTd
            );

            tr.appendChild(
                memberTd
            );

            tr.appendChild(
                actionTd
            );


            tableBody.appendChild(
                tr
            );

        }
    );


    createBlankRow();

    updateSummary();

}


/* =========================================
   CREATE NEW BLANK ROW
========================================= */

function createBlankRow(){

    const tr =
        document.createElement(
            "tr"
        );


    tr.className =
        "new-row";


    /* FAMILY */

    const familyTd =
        document.createElement(
            "td"
        );


    const familyInput =
        createInput(
            "family-input",
            "",
            "পরিবারের নাম লিখুন"
        );


    familyInput.id =
        "newFamilyInput";


    familyInput.addEventListener(
        "keydown",
        function(event){

            if(
                event.key ===
                "Enter"
            ){

                event.preventDefault();

                event.stopPropagation();


                const memberInput =
                    tr.querySelector(
                        ".member-input"
                    );


                focusInput(
                    memberInput
                );

            }

        }
    );


    familyTd.appendChild(
        familyInput
    );


    /* MEMBER */

    const memberTd =
        document.createElement(
            "td"
        );


    const memberInput =
        createInput(
            "member-input",
            "",
            "সংখ্যা লিখুন"
        );


    memberInput.id =
        "newMemberInput";


    memberInput.addEventListener(
        "keydown",
        function(event){

            if(
                event.key ===
                "Enter"
            ){

                event.preventDefault();

                event.stopPropagation();

                saveNewFamily();

            }

        }
    );


    memberTd.appendChild(
        memberInput
    );


    /* FINISH */

    const actionTd =
        document.createElement(
            "td"
        );


    const finishBtn =
        document.createElement(
            "button"
        );


    finishBtn.type =
        "button";

    finishBtn.className =
        "finish-btn";

    finishBtn.textContent =
        "✓ শেষ";


    finishBtn.addEventListener(
        "click",
        function(){

            saveNewFamily();

        }
    );


    actionTd.appendChild(
        finishBtn
    );


    tr.appendChild(
        familyTd
    );

    tr.appendChild(
        memberTd
    );

    tr.appendChild(
        actionTd
    );


    tableBody.appendChild(
        tr
    );

}


/* =========================================
   SAVE NEW FAMILY
========================================= */

function saveNewFamily(){

    const familyInput =
        document.getElementById(
            "newFamilyInput"
        );


    const memberInput =
        document.getElementById(
            "newMemberInput"
        );


    if(
        !familyInput ||
        !memberInput
    ){

        return;

    }


    const name =
        familyInput.value.trim();


    const members =
        toEnglishNumbers(
            memberInput.value
        );


    if(name === ""){

        focusInput(
            familyInput
        );

        return;

    }


    families.push({

        name:name,

        members:members

    });


    saveData();

    render();

    updateSummary();


    const newInput =
        document.getElementById(
            "newFamilyInput"
        );


    if(newInput){

        newInput.focus();


        try{

            newInput.setSelectionRange(
                0,
                0
            );

        }
        catch(error){}

    }

}


/* =========================================
   CREATE NEXT FAMILY
========================================= */

function createNextFamily(){

    const familyInput =
        document.getElementById(
            "newFamilyInput"
        );


    const memberInput =
        document.getElementById(
            "newMemberInput"
        );


    if(
        !familyInput ||
        !memberInput
    ){

        return;

    }


    const name =
        familyInput.value.trim();


    const members =
        toEnglishNumbers(
            memberInput.value
        );


    if(name === ""){

        focusInput(
            familyInput
        );

        return;

    }


    families.push({

        name:name,

        members:members

    });


    saveData();

    render();

    updateSummary();


    const newInput =
        document.getElementById(
            "newFamilyInput"
        );


    if(newInput){

        newInput.focus();


        try{

            newInput.setSelectionRange(
                0,
                0
            );

        }
        catch(error){}

    }

}


/* =========================================
   BACKUP
========================================= */

function backupData(){
async function backupData(){

    const backup = {

        app:
            "পরিবার হিসাব",

        version:
            2,

        backupDate:
            new Date().toISOString(),

        families:
            families

    };


    const json =
        JSON.stringify(
            backup,
            null,
            2
        );


    const blob =
        new Blob(
            [json],
            {
                type:
                    "application/json"
            }
        );


    const date =
        new Date();


    const filename =
        "পরিবার-হিসাব-" +
        date.getFullYear() +
        "-" +
        String(
            date.getMonth() + 1
        ).padStart(2,"0") +
        "-" +
        String(
            date.getDate()
        ).padStart(2,"0") +
        ".json";


    const file =
        new File(
            [blob],
            filename,
            {
                type:
                    "application/json"
            }
        );


    /* iPhone Share Sheet */

    if(
        navigator.share &&
        navigator.canShare &&
        navigator.canShare({
            files:[file]
        })
    ){

        try{

            await navigator.share({

                files:[file],

                title:
                    "পরিবার হিসাব Backup",

                text:
                    "পরিবার হিসাবের Backup ফাইল"

            });

            return;

        }
        catch(error){

            /* User cancelled Share Sheet */

            if(
                error &&
                error.name ===
                "AbortError"
            ){

                return;

            }

        }

    }


    /* Fallback */

    const url =
        URL.createObjectURL(
            blob
        );


    const link =
        document.createElement(
            "a"
        );


    link.href =
        url;

    link.download =
        filename;

    link.style.display =
        "none";


    document.body.appendChild(
        link
    );


    link.click();

    link.remove();


    setTimeout(
        function(){

            URL.revokeObjectURL(
                url
            );

        },
        1000
    );

}
    
/* =========================================
   RESTORE BUTTON
========================================= */

restoreBtn.addEventListener(
    "click",
    function(){

        restoreFile.value = "";

        restoreFile.click();

    }
);


/* =========================================
   RESTORE FILE
========================================= */

restoreFile.addEventListener(
    "change",
    function(){

        const file =
            this.files &&
            this.files[0];


        if(!file){

            return;

        }


        const reader =
            new FileReader();


        reader.onload =
            function(event){

                try{

                    const backup =
                        JSON.parse(
                            event.target.result
                        );


                    if(
                        !backup ||
                        !Array.isArray(
                            backup.families
                        )
                    ){

                        throw new Error(
                            "Invalid backup"
                        );

                    }


                    const ok =
                        confirm(
                            "বর্তমান তালিকা পরিবর্তন করে এই Backup রিস্টোর করবেন?"
                        );


                    if(!ok){

                        return;

                    }


                    families =
                        backup.families

                        .map(
                            function(item){

                                return {

                                    name:
                                        String(
                                            item.name ||
                                            ""
                                        ),

                                    members:
                                        toEnglishNumbers(
                                            item.members ||
                                            ""
                                        )

                                };

                            }
                        )

                        .filter(
                            function(item){

                                return (
                                    item.name.trim() !== ""
                                );

                            }
                        );


                    saveData();

                    render();

                    updateSummary();


                    alert(
                        "Backup সফলভাবে রিস্টোর হয়েছে।"
                    );

                }
                catch(error){

                    console.log(error);


                    alert(
                        "এই Backup ফাইলটি সঠিক নয়।"
                    );

                }

            };


        reader.readAsText(
            file
        );

    }
);


/* =========================================
   CLEAR ALL
========================================= */

clearBtn.addEventListener(
    "click",
    function(){

        if(
            families.length === 0
        ){

            return;

        }


        const ok =
            confirm(
                "সব পরিবারের তালিকা মুছে ফেলবেন?"
            );


        if(!ok){

            return;

        }


        families = [];


        saveData();

        render();

        updateSummary();


        const input =
            document.getElementById(
                "newFamilyInput"
            );


        if(input){

            input.focus();

        }

    }
);


/* =========================================
   BACKUP BUTTON
========================================= */

backupBtn.addEventListener(
    "click",
    backupData
);


/* =========================================
   START APP
========================================= */

loadData();

render();

updateSummary();


/* =========================================
   SERVICE WORKER
========================================= */

if(
    "serviceWorker" in navigator
){

    window.addEventListener(
        "load",
        function(){

            navigator.serviceWorker
                .register(
                    "./service-worker.js"
                )

                .catch(
                    function(error){

                        console.log(
                            "Service Worker:",
                            error
                        );

                    }
                );

        }
    );

}

</script>
