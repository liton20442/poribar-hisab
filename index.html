<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#2563eb">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="পরিবার হিসাব">

<title>পরিবার হিসাব</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:-apple-system,BlinkMacSystemFont,"Noto Sans Bengali",Arial,sans-serif;
background:#f3f6fa;
color:#172033
}

.container{
max-width:720px;
margin:auto;
padding:18px
}

h1{
text-align:center;
margin:4px 0 18px
}

.card{
background:#fff;
border-radius:16px;
padding:16px;
margin-bottom:14px;
box-shadow:0 3px 14px rgba(0,0,0,.08)
}

label{
display:block;
font-weight:700;
margin:10px 0 6px
}

input{
width:100%;
padding:13px;
border:1px solid #ccd5e1;
border-radius:10px;
font-size:16px
}

button{
border:0;
border-radius:10px;
padding:12px 15px;
font-size:16px;
font-weight:700
}

.primary{
background:#2563eb;
color:#fff;
width:100%;
margin-top:12px
}

.secondary{
background:#e8eef7;
color:#172033
}

.danger{
background:#dc2626;
color:#fff
}

.restore{
background:#059669;
color:#fff
}

.actions{
display:flex;
gap:8px;
flex-wrap:wrap;
margin-top:10px
}

.stats{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px
}

.stat{
background:#eef4ff;
border-radius:12px;
padding:14px;
text-align:center
}

.stat b{
display:block;
font-size:25px;
color:#2563eb;
margin-top:4px
}

.family{
border:1px solid #e1e7ef;
border-radius:12px;
padding:13px;
margin-top:10px
}

.family-title{
font-size:18px;
font-weight:800
}

.meta{
color:#5c6677;
margin-top:5px
}

.empty{
text-align:center;
color:#6b7280;
padding:20px
}

.deleted{
background:#fff7ed;
border-color:#fed7aa
}

.hidden{
display:none!important
}

.small{
font-size:13px;
color:#6b7280;
margin-top:8px
}
</style>
</head>

<body>

<div class="container">

<h1>পরিবার হিসাব</h1>

<div class="card">

<div class="stats">

<div class="stat">
মোট পরিবার
<b id="totalFamilies">0</b>
</div>

<div class="stat">
মোট সদস্য
<b id="totalMembers">0</b>
</div>

</div>

</div>


<div class="card">

<h2 id="formTitle">পরিবার যোগ করুন</h2>

<label for="familyName">পরিবারের নাম</label>

<input
id="familyName"
type="text"
placeholder="পরিবারের নাম লিখুন"
autocomplete="off"
>


<label for="memberCount">সদস্য সংখ্যা</label>

<input
id="memberCount"
type="number"
min="0"
inputmode="numeric"
placeholder="সদস্য সংখ্যা লিখুন"
>


<button
class="primary"
id="saveBtn"
onclick="saveFamily()">
পরিবার যোগ করুন
</button>


<button
class="secondary hidden"
id="cancelBtn"
onclick="clearForm()"
style="width:100%;margin-top:8px">
Edit বাতিল
</button>


<div class="small">
পরিবারের নাম ও সদস্য সংখ্যা বাধ্যতামূলক।
</div>

</div>


<div class="card">

<input
id="searchBox"
type="search"
placeholder="পরিবারের নাম দিয়ে Search করুন"
oninput="render()"
>


<div class="actions">

<button
class="secondary"
onclick="showActive()">
সক্রিয় পরিবার
</button>


<button
class="restore"
onclick="showDeleted()">
Restore
</button>

</div>


<div id="familyList"></div>

</div>

</div>


<script>

const KEY="poribarHisabDataV2";

let families=[];
let editingId=null;
let view="active";


function load(){

try{

families=
JSON.parse(localStorage.getItem(KEY))||[];

}catch(e){

families=[];

}

if(!Array.isArray(families))
families=[];

}


function save(){

localStorage.setItem(
KEY,
JSON.stringify(families)
);

}


function esc(v){

return String(v).replace(
/[&<>"']/g,
c=>({

"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#039;"

}[c])

);

}


function saveFamily(){

const name=
document.getElementById("familyName")
.value
.trim();

const raw=
document.getElementById("memberCount")
.value
.trim();


if(!name){

alert("পরিবারের নাম লিখুন।");
return;

}


if(
raw===""||
Number(raw)<0||
!Number.isFinite(Number(raw))
){

alert("সঠিক সদস্য সংখ্যা লিখুন।");
return;

}


const members=
Math.floor(Number(raw));


if(editingId!==null){

const x=
families.find(
x=>x.id===editingId
);

if(x){

x.name=name;
x.members=members;

}

}else{

families.push({

id:
Date.now()+"_"+
Math.random()
.toString(36)
.slice(2),

name:name,

members:members,

deleted:false

});

}


save();

clearForm();

render();

}


function editFamily(id){

const x=
families.find(
x=>x.id===id
);

if(!x)return;


editingId=id;

document.getElementById(
"familyName"
).value=x.name;


document.getElementById(
"memberCount"
).value=x.members;


document.getElementById(
"formTitle"
).textContent=
"পরিবার Edit করুন";


document.getElementById(
"saveBtn"
).textContent=
"পরিবর্তন সংরক্ষণ করুন";


document.getElementById(
"cancelBtn"
).classList
.remove("hidden");


window.scrollTo({
top:0,
behavior:"smooth"
});

}


function clearForm(){

editingId=null;

document.getElementById(
"familyName"
).value="";


document.getElementById(
"memberCount"
).value="";


document.getElementById(
"formTitle"
).textContent=
"পরিবার যোগ করুন";


document.getElementById(
"saveBtn"
).textContent=
"পরিবার যোগ করুন";


document.getElementById(
"cancelBtn"
).classList
.add("hidden");

}


function deleteFamily(id){

const x=
families.find(
x=>x.id===id
);

if(!x)return;


if(
confirm(
'"'+x.name+
'" পরিবারটি Delete করবেন?'
)
){

x.deleted=true;

save();

render();

}

}


function restoreFamily(id){

const x=
families.find(
x=>x.id===id
);

if(!x)return;

x.deleted=false;

save();

render();

}


function permanentDelete(id){

const x=
families.find(
x=>x.id===id
);

if(!x)return;


if(
confirm(
'"'+x.name+
'" স্থায়ীভাবে মুছে ফেলবেন? Restore করা যাবে না।'
)
){

families=
families.filter(
x=>x.id!==id
);

save();

render();

}

}


function showActive(){

view="active";

render();

}


function showDeleted(){

view="deleted";

render();

}


function render(){

const q=
document.getElementById(
"searchBox"
).value
.trim()
.toLowerCase();


const active=
families.filter(
x=>!x.deleted
);


document.getElementById(
"totalFamilies"
).textContent=
active.length;


document.getElementById(
"totalMembers"
).textContent=
active.reduce(
(s,x)=>
s+Number(x.members||0),
0
);


let list=
families.filter(
x=>
view==="active"
?!
x.deleted
:
x.deleted
);


if(q){

list=
list.filter(
x=>
x.name
.toLowerCase()
.includes(q)
);

}


list.sort(
(a,b)=>
a.name.localeCompare(
b.name,
"bn"
)
);


const box=
document.getElementById(
"familyList"
);


if(!list.length){

box.innerHTML=
'<div class="empty">'+
(
view==="active"
?
"কোনো পরিবার পাওয়া যায়নি।"
:
"Restore করার মতো কোনো পরিবার নেই।"
)+
'</div>';

return;

}


box.innerHTML=
list.map(x=>{

if(view==="deleted"){

return `

<div class="family deleted">

<div class="family-title">
${esc(x.name)}
</div>

<div class="meta">
সদস্য সংখ্যা:
<b>${x.members}</b>
</div>

<div class="actions">

<button
class="restore"
onclick="restoreFamily('${x.id}')">
Restore
</button>

<button
class="danger"
onclick="permanentDelete('${x.id}')">
স্থায়ী Delete
</button>

</div>

</div>

`;

}


return `

<div class="family">

<div class="family-title">
${esc(x.name)}
</div>

<div class="meta">
সদস্য সংখ্যা:
<b>${x.members}</b>
</div>

<div class="actions">

<button
class="secondary"
onclick="editFamily('${x.id}')">
Edit
</button>

<button
class="danger"
onclick="deleteFamily('${x.id}')">
Delete
</button>

</div>

</div>

`;

}).join("");

}


if("serviceWorker" in navigator){

window.addEventListener(
"load",
()=>{

navigator.serviceWorker
.register("./service-worker.js")
.catch(()=>{});

});

}


load();

render();

</script>

</body>
</html>
