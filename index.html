<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1,
               maximum-scale=1,
               viewport-fit=cover">

<title>পরিবার হিসাব</title>

<!-- PWA -->
<link rel="manifest" href="./manifest.json">

<meta name="theme-color" content="#2563eb">

<!-- iPhone / iOS -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="পরিবার হিসাব">

<style>

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,
body{
  margin:0;
  padding:0;
  min-height:100%;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Noto Sans Bengali",
    "Noto Sans",
    Arial,
    sans-serif;

  background:#f3f6fb;
  color:#172033;
}

body{
  padding-bottom:env(safe-area-inset-bottom);
}

/* =========================
   HEADER
========================= */

.header{
  background:linear-gradient(135deg,#2563eb,#1d4ed8);
  color:#fff;

  padding:
    calc(16px + env(safe-area-inset-top))
    18px
    18px;

  box-shadow:
    0 4px 18px rgba(37,99,235,.22);
}

.header-top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
}

.logo{
  width:50px;
  height:50px;

  border-radius:15px;

  background:rgba(255,255,255,.18);

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:28px;

  flex:none;
}

.title-wrap{
  flex:1;
}

.title{
  font-size:28px;
  font-weight:800;
  line-height:1.15;
}

.subtitle{
  font-size:15px;
  margin-top:5px;
  opacity:.9;
}

.clear-btn{
  border:
    1px solid
    rgba(255,255,255,.35);

  background:
    rgba(255,255,255,.13);

  color:#fff;

  border-radius:11px;

  padding:10px 12px;

  font-size:14px;
  font-weight:700;
}

/* =========================
   MAIN
========================= */

.container{
  max-width:900px;
  margin:auto;
  padding:16px;
}

/* =========================
   SUMMARY
========================= */

.summary{
  display:grid;
  grid-template-columns:1fr 1fr;

  gap:12px;

  margin-bottom:16px;
}

.summary-card{
  background:#fff;

  border-radius:17px;

  padding:17px;

  text-align:center;

  box-shadow:
    0 5px 18px rgba(15,23,42,.07);

  border:1px solid #e5eaf2;
}

.summary-number{
  font-size:30px;
  font-weight:800;

  color:#2563eb;

  line-height:1.1;
}

.summary-label{
  font-size:15px;
  font-weight:700;

  color:#596579;

  margin-top:7px;
}

/* =========================
   TABLE CARD
========================= */

.table-card{
  background:#fff;

  border-radius:18px;

  box-shadow:
    0 5px 20px rgba(15,23,42,.08);

  overflow:hidden;

  border:1px solid #e5eaf2;
}

.table-head{
  display:flex;

  align-items:center;

  justify-content:space-between;

  gap:10px;

  padding:15px 16px;

  border-bottom:
    1px solid #e8edf4;
}

.table-title{
  font-size:20px;
  font-weight:800;
}

/* =========================
   ENTER HINT
========================= */

.enter-hint{
  display:flex;

  align-items:center;

  gap:6px;

  background:#2563eb;

  color:#fff;

  border-radius:999px;

  padding:7px 10px;

  font-size:13px;

  font-weight:800;

  box-shadow:
    0 4px 12px rgba(37,99,235,.25);

  animation:pulse 1.8s infinite;
}

.enter-key{
  background:#fff;

  color:#2563eb;

  border-radius:5px;

  padding:2px 6px;

  font-size:12px;

  font-weight:900;
}

@keyframes pulse{

  0%,100%{
    transform:scale(1);
  }

  50%{
    transform:scale(1.04);
  }

}

/* =========================
   TABLE
========================= */

.table-wrap{
  overflow-x:auto;
}

table{
  width:100%;

  border-collapse:collapse;

  min-width:480px;
}

th{
  background:#f1f5ff;

  color:#1e3a8a;

  font-size:17px;

  font-weight:800;

  padding:13px 10px;

  border-bottom:
    2px solid #dbe5f5;
}

td{
  padding:10px;

  border-bottom:
    1px solid #e8edf4;

  text-align:center;
}

td:first-child{
  text-align:left;
}

/* =========================
   INPUT
========================= */

input{
  width:100%;

  height:46px;

  border:
    1px solid #cfd8e6;

  border-radius:10px;

  background:#fff;

  padding:8px 11px;

  font-size:18px;

  color:#172033;

  outline:none;
}

input:focus{
  border:
    2px solid #2563eb;

  background:#f8fbff;
}

input::placeholder{
  color:#9aa6b5;
}

/* =========================
   DELETE BUTTON
========================= */

.delete-btn{
  min-width:70px;

  height:40px;

  border:0;

  border-radius:10px;

  background:#fee2e2;

  color:#b91c1c;

  font-size:15px;

  font-weight:800;
}

/* =========================
   FOOTER
========================= */

.footer{
  text-align:center;

  color:#7b8798;

  font-size:13px;

  padding:18px 0 8px;
}

/* =========================
   MOBILE
========================= */

@media(max-width:600px){

  .container{
    padding:12px;
  }

  .header{
    padding-left:14px;
    padding-right:14px;
  }

  .title{
    font-size:25px;
  }

  .subtitle{
    font-size:14px;
  }

  .clear-btn{
    font-size:13px;
    padding:9px 10px;
  }

  .summary-card{
    padding:15px 8px;
  }

  .summary-number{
    font-size:28px;
  }

  .summary-label{
    font-size:14px;
  }

  .table-title{
    font-size:19px;
  }

  .enter-hint{
    font-size:12px;
    padding:6px 8px;
  }

  th{
    font-size:16px;
  }

  input{
    font-size:17px;
  }

}

/* =========================
   STANDALONE APP MODE
========================= */

@media(display-mode:standalone){

  html,
  body{
    overscroll-behavior:none;
  }

}

</style>
</head>


<body>

<!-- =========================
     HEADER
========================= -->

<header class="header">

  <div class="header-top">

    <div class="logo">
      🏠
    </div>

    <div class="title-wrap">

      <div class="title">
        পরিবার হিসাব
      </div>

      <div class="subtitle">
        পরিবার ও সদস্য সংখ্যা সহজে সংরক্ষণ করুন
      </div>

    </div>

    <button
      class="clear-btn"
      onclick="clearAll()">

      সব মুছুন

    </button>

  </div>

</header>


<!-- =========================
     MAIN
========================= -->

<main class="container">


  <!-- SUMMARY -->

  <section class="summary">

    <div class="summary-card">

      <div
        class="summary-number"
        id="familyTotal">

        0

      </div>

      <div class="summary-label">
        মোট পরিবার সংখ্যা
      </div>

    </div>


    <div class="summary-card">

      <div
        class="summary-number"
        id="memberTotal">

        0

      </div>

      <div class="summary-label">
        মোট সদস্য সংখ্যা
      </div>

    </div>

  </section>



  <!-- TABLE -->

  <section class="table-card">


    <div class="table-head">

      <div class="table-title">
        পরিবারের তালিকা
      </div>


      <div class="enter-hint">

        <span class="enter-key">
          Enter
        </span>

        <span>
          চাপুন
        </span>

      </div>

    </div>



    <div class="table-wrap">

      <table>

        <thead>

          <tr>

            <th style="width:52%">
              পরিবারের নাম
            </th>

            <th style="width:25%">
              সদস্য
            </th>

            <th style="width:23%">
              কাজ
            </th>

          </tr>

        </thead>


        <tbody id="familyBody">
        </tbody>

      </table>

    </div>

  </section>


  <div class="footer">
    ডাটা এই ফোনেই স্বয়ংক্রিয়ভাবে সংরক্ষিত থাকবে
  </div>

</main>



<script>

/* =========================
   STORAGE
========================= */

const STORAGE_KEY =
  "poribarHisabSimpleV1";

let families = [];

let newFamilyName = "";


/* =========================
   LOAD DATA
========================= */

function loadData(){

  try{

    const saved =
      JSON.parse(
        localStorage.getItem(STORAGE_KEY) || "[]"
      );

    if(Array.isArray(saved)){

      families =
        saved
        .filter(
          x =>
            x &&
            String(x.name || "").trim() !== ""
        )
        .map(x => ({

          name:
            String(x.name || "").trim(),

          members:
            String(x.members || "")
            .replace(/\D/g,"")

        }));

    }

  }

  catch(e){

    families = [];

  }

}


/* =========================
   SAVE DATA
========================= */

function saveData(){

  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify(families)
  );

}


/* =========================
   SUMMARY
========================= */

function updateSummary(){

  document
    .getElementById("familyTotal")
    .textContent =
      families.length;


  let total = 0;


  families.forEach(x => {

    const n =
      parseInt(x.members,10);

    if(!isNaN(n)){

      total += n;

    }

  });


  document
    .getElementById("memberTotal")
    .textContent =
      total;

}


/* =========================
   CREATE EXISTING INPUT
========================= */

function makeInput(
  value,
  type,
  index
){

  const input =
    document.createElement("input");


  input.type = "text";

  input.value =
    value || "";


  /* MEMBER */

  if(type === "member"){

    input.inputMode =
      "numeric";

    input.pattern =
      "[0-9]*";

    input.autocomplete =
      "off";


    input.oninput =
      function(){

        this.value =
          this.value.replace(
            /\D/g,
            ""
          );

        families[index].members =
          this.value;

        saveData();

        updateSummary();

      };


    input.onkeydown =
      function(e){

        if(e.key === "Enter"){

          e.preventDefault();


          if(
            this.value.trim() === ""
          ){

            return;

          }


          families[index].members =
            this.value.trim();


          saveData();

          render();

          focusNewName();

        }

      };

  }


  /* FAMILY NAME */

  else{

    input.autocomplete =
      "off";


    input.oninput =
      function(){

        families[index].name =
          this.value;

        saveData();

      };


    input.onkeydown =
      function(e){

        if(e.key === "Enter"){

          e.preventDefault();


          const name =
            this.value.trim();


          if(!name){

            return;

          }


          families[index].name =
            name;


          saveData();

          render();


          const member =
            document.querySelector(
              '[data-new-member="1"]'
            );


          if(member){

            member.focus();

          }

        }

      };

  }


  return input;

}


/* =========================
   RENDER
========================= */

function render(){

  const body =
    document.getElementById(
      "familyBody"
    );


  body.innerHTML = "";


  /* EXISTING FAMILY ROWS */

  families.forEach(
    (family,index) => {

      const tr =
        document.createElement("tr");


      /* NAME */

      const nameTd =
        document.createElement("td");


      nameTd.appendChild(
        makeInput(
          family.name,
          "name",
          index
        )
      );


      /* MEMBER */

      const memberTd =
        document.createElement("td");


      const memberInput =
        makeInput(
          family.members,
          "member",
          index
        );


      memberInput.setAttribute(
        "data-member-row",
        "1"
      );


      memberTd.appendChild(
        memberInput
      );


      /* ACTION */

      const actionTd =
        document.createElement("td");


      const btn =
        document.createElement(
          "button"
        );


      btn.className =
        "delete-btn";


      btn.textContent =
        "মুছুন";


      btn.onclick =
        function(){

          families.splice(
            index,
            1
          );

          saveData();

          render();

          focusNewName();

        };


      actionTd.appendChild(btn);


      tr.append(
        nameTd,
        memberTd,
        actionTd
      );


      body.appendChild(tr);

    }
  );


  /* =========================
     NEW BLANK ROW
  ========================= */

  const tr =
    document.createElement("tr");


  /* NEW NAME */

  const nameTd =
    document.createElement("td");


  const nameInput =
    document.createElement("input");


  nameInput.type =
    "text";

  nameInput.placeholder =
    "পরিবারের নাম লিখুন";

  nameInput.autocomplete =
    "off";

  nameInput.value =
    newFamilyName;


  nameInput.oninput =
    function(){

      newFamilyName =
        this.value;

    };


  nameInput.onkeydown =
    function(e){

      if(e.key === "Enter"){

        e.preventDefault();


        const name =
          this.value.trim();


        if(!name){

          return;

        }


        /*
          নতুন পরিবার সরাসরি
          তালিকায় যোগ হবে
        */

        families.push({

          name:name,

          members:""

        });


        newFamilyName =
          "";


        saveData();

        render();


        /*
          নতুন যোগ হওয়া
          সদস্য ঘরে Focus
        */

        setTimeout(
          function(){

            const inputs =
              document.querySelectorAll(
                '[data-member-row="1"]'
              );


            const last =
              inputs[inputs.length - 1];


            if(last){

              last.focus();

            }

          },
          50
        );

      }

    };


  nameTd.appendChild(
    nameInput
  );


  /* NEW MEMBER */

  const memberTd =
    document.createElement("td");


  const memberInput =
    document.createElement("input");


  memberInput.type =
    "text";

  memberInput.placeholder =
    "সংখ্যা";

  memberInput.inputMode =
    "numeric";

  memberInput.pattern =
    "[0-9]*";

  memberInput.setAttribute(
    "data-new-member",
    "1"
  );


  memberInput.oninput =
    function(){

      this.value =
        this.value.replace(
          /\D/g,
          ""
        );

    };


  memberInput.onkeydown =
    function(e){

      if(e.key === "Enter"){

        e.preventDefault();


        const n =
          this.value.trim();


        if(n === ""){

          return;

        }


        /*
          শেষ পরিবারটির
          সদস্য সংখ্যা বসানো
        */

        if(
          families.length &&
          families[
            families.length - 1
          ].members === ""
        ){

          families[
            families.length - 1
          ].members = n;


          saveData();


          newFamilyName =
            "";


          render();


          focusNewName();

        }

      }

    };


  memberTd.appendChild(
    memberInput
  );


  /* NEW ACTION */

  const actionTd =
    document.createElement("td");


  const dash =
    document.createElement("span");


  dash.textContent =
    "—";

  dash.style.color =
    "#94a3b8";

  dash.style.fontSize =
    "18px";


  actionTd.appendChild(
    dash
  );


  tr.append(
    nameTd,
    memberTd,
    actionTd
  );


  body.appendChild(tr);


  updateSummary();

}


/* =========================
   FOCUS NEW NAME
========================= */

function focusNewName(){

  setTimeout(
    function(){

      const rows =
        document.querySelectorAll(
          "#familyBody tr"
        );


      const lastRow =
        rows[rows.length - 1];


      if(lastRow){

        const input =
          lastRow.querySelector(
            "input"
          );


        if(input){

          input.focus();

        }

      }

    },
    50
  );

}


/* =========================
   CLEAR ALL
========================= */

function clearAll(){

  if(families.length === 0){

    return;

  }


  if(
    confirm(
      "সব পরিবারের তথ্য মুছে ফেলবেন?"
    )
  ){

    families = [];

    newFamilyName = "";


    saveData();

    render();

    focusNewName();

  }

}


/* =========================
   START
========================= */

loadData();

render();


/* =========================
   SERVICE WORKER
========================= */

if(
  "serviceWorker" in navigator
){

  window.addEventListener(
    "load",
    function(){

      navigator.serviceWorker
        .register(
          "./service-worker.js"
        )
        .catch(
          function(error){

            console.log(
              "Service Worker Error:",
              error
            );

          }
        );

    }
  );

}

</script>

</body>
</html>
