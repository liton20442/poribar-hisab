<!DOCTYPE html>
<html lang="bn">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<meta name="theme-color" content="#2563eb">

<title>পরিবার হিসাব</title>


<style>

/* =====================================================
   BASIC
===================================================== */

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,
body{
  margin:0;
  padding:0;
  width:100%;
  min-height:100%;
}

body{

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Arial,
    sans-serif;

  background:
    linear-gradient(
      180deg,
      #eef5ff 0%,
      #f6f8fc 38%,
      #f8fafc 100%
    );

  color:#1e293b;

  -webkit-font-smoothing:antialiased;
}


/* =====================================================
   APP CONTAINER
===================================================== */

.app{
  width:100%;
  max-width:760px;
  margin:0 auto;
  min-height:100vh;
}


/* =====================================================
   HEADER
===================================================== */

.header{

  background:
    linear-gradient(
      135deg,
      #2563eb,
      #1d4ed8
    );

  color:white;

  padding:
    18px
    16px
    20px;

  border-radius:
    0
    0
    24px
    24px;

  box-shadow:
    0 6px 20px
    rgba(37,99,235,.22);

  position:relative;
}


.header-top{

  display:flex;

  align-items:center;

  justify-content:space-between;

  gap:12px;
}


.logo-area{

  display:flex;

  align-items:center;

  gap:11px;
}


.logo{

  width:44px;
  height:44px;

  background:
    rgba(255,255,255,.18);

  border:
    1px solid
    rgba(255,255,255,.28);

  border-radius:13px;

  display:flex;

  align-items:center;
  justify-content:center;

  font-size:24px;

  box-shadow:
    inset 0 1px 1px
    rgba(255,255,255,.15);
}


.title-area h1{

  margin:0;

  font-size:24px;

  font-weight:700;

  letter-spacing:.1px;
}


.title-area p{

  margin:3px 0 0;

  font-size:13px;

  color:
    rgba(255,255,255,.82);
}


.clear-btn{

  border:0;

  background:
    rgba(255,255,255,.15);

  color:white;

  border:
    1px solid
    rgba(255,255,255,.25);

  border-radius:10px;

  padding:9px 12px;

  font-size:13px;

  font-weight:600;

  cursor:pointer;

  white-space:nowrap;

  box-shadow:
    0 2px 6px
    rgba(0,0,0,.08);
}


.clear-btn:active{

  transform:scale(.96);

  background:
    rgba(255,255,255,.24);
}


/* =====================================================
   CONTENT
===================================================== */

.content{

  padding:
    14px
    12px
    30px;
}


/* =====================================================
   SUMMARY
===================================================== */

.summary{

  display:grid;

  grid-template-columns:
    1fr 1fr;

  gap:11px;

  margin-bottom:14px;
}


.summary-card{

  background:white;

  border-radius:16px;

  padding:
    14px
    12px;

  display:flex;

  align-items:center;

  gap:10px;

  box-shadow:
    0 3px 12px
    rgba(15,23,42,.07);

  border:
    1px solid
    #e7edf5;
}


.summary-icon{

  width:40px;
  height:40px;

  flex-shrink:0;

  border-radius:11px;

  background:#eff6ff;

  display:flex;

  align-items:center;
  justify-content:center;

  font-size:20px;
}


.summary-info{

  min-width:0;
}


.summary-label{

  font-size:12px;

  color:#64748b;

  margin-bottom:2px;

  white-space:nowrap;
}


.summary-number{

  font-size:23px;

  line-height:1.1;

  font-weight:750;

  color:#1d4ed8;
}


/* =====================================================
   TABLE CARD
===================================================== */

.table-card{

  background:white;

  border-radius:18px;

  overflow:hidden;

  box-shadow:
    0 4px 16px
    rgba(15,23,42,.08);

  border:
    1px solid
    #e5eaf1;
}


/* =====================================================
   TABLE TITLE BAR
===================================================== */

.table-title{

  padding:
    13px
    14px;

  display:flex;

  align-items:center;

  justify-content:space-between;

  border-bottom:
    1px solid
    #e8edf3;
}


.table-title-left{

  display:flex;

  align-items:center;

  gap:9px;
}


.table-title-icon{

  width:34px;
  height:34px;

  border-radius:10px;

  background:#eff6ff;

  display:flex;

  align-items:center;
  justify-content:center;

  font-size:17px;
}


.table-title-text{

  font-size:16px;

  font-weight:700;

  color:#1e293b;
}


.table-hint{

  font-size:11px;

  color:#94a3b8;

  text-align:right;
}


/* =====================================================
   TABLE
===================================================== */

.table-wrapper{

  width:100%;

  overflow-x:hidden;
}


table{

  width:100%;

  border-collapse:collapse;

  table-layout:fixed;
}


thead th{

  background:#f8fafc;

  color:#475569;

  font-size:13px;

  font-weight:700;

  padding:
    11px
    7px;

  text-align:left;

  border-bottom:
    1px solid
    #dfe6ee;
}


thead th:nth-child(1){
  width:49%;
}

thead th:nth-child(2){
  width:25%;
  text-align:center;
}

thead th:nth-child(3){
  width:26%;
  text-align:center;
}


/* =====================================================
   TABLE ROW
===================================================== */

tbody tr{

  border-bottom:
    1px solid
    #edf1f5;

  background:white;

  transition:
    background .15s ease;
}


tbody tr:last-child{
  border-bottom:0;
}


tbody tr:focus-within{

  background:#f8fbff;
}


/* =====================================================
   CELLS
===================================================== */

td{

  padding:0;

  border-right:
    1px solid
    #edf1f5;

  vertical-align:middle;
}


td:last-child{
  border-right:0;
}


/* =====================================================
   INPUT
===================================================== */

td input{

  width:100%;

  height:48px;

  border:0;

  outline:none;

  background:transparent;

  color:#1e293b;

  padding:
    10px
    9px;

  font-family:inherit;

  font-size:16px;

  font-weight:500;

  border-radius:0;

  appearance:none;

  -webkit-appearance:none;
}


td input::placeholder{

  color:#a3afbf;

  font-weight:400;
}


td input:focus{

  background:#eff6ff;

  box-shadow:
    inset 0 0 0 2px
    #3b82f6;
}


.member-input{

  text-align:center;
}


/* =====================================================
   DELETE BUTTON
===================================================== */

.delete-cell{

  text-align:center;

  padding:5px;
}


.delete-btn{

  min-width:58px;

  height:34px;

  border:0;

  border-radius:8px;

  background:#fee2e2;

  color:#dc2626;

  font-size:12px;

  font-weight:700;

  cursor:pointer;

  transition:
    all .15s ease;
}


.delete-btn:active{

  transform:scale(.94);

  background:#fecaca;
}


/* =====================================================
   EMPTY / NEW ROW
===================================================== */

.new-row{

  background:#fbfdff;
}


.new-row td{

  border-top:
    1px dashed
    #dbe4ef;
}


.new-row input{

  color:#64748b;
}


.new-row input:focus{

  color:#1e293b;
}


/* =====================================================
   FOOTER
===================================================== */

.footer{

  text-align:center;

  padding:
    14px 10px
    4px;

  color:#94a3b8;

  font-size:11px;
}


/* =====================================================
   SMALL SCREEN
===================================================== */

@media(max-width:480px){

  .header{

    padding:
      16px
      12px
      18px;

    border-radius:
      0
      0
      20px
      20px;
  }


  .logo{

    width:40px;
    height:40px;

    font-size:21px;
  }


  .title-area h1{

    font-size:21px;
  }


  .title-area p{

    font-size:11px;
  }


  .clear-btn{

    padding:
      8px 10px;

    font-size:12px;
  }


  .content{

    padding:
      11px
      8px
      25px;
  }


  .summary{

    gap:8px;
  }


  .summary-card{

    padding:
      12px 9px;

    border-radius:14px;

    gap:8px;
  }


  .summary-icon{

    width:34px;
    height:34px;

    font-size:17px;
  }


  .summary-label{

    font-size:11px;
  }


  .summary-number{

    font-size:21px;
  }


  .table-card{

    border-radius:15px;
  }


  .table-title{

    padding:
      11px;
  }


  .table-title-text{

    font-size:15px;
  }


  .table-hint{

    font-size:10px;
  }


  thead th{

    font-size:12px;

    padding:
      10px 5px;
  }


  td input{

    height:46px;

    font-size:15px;

    padding:
      9px 7px;
  }


  .delete-btn{

    min-width:52px;

    height:32px;

    font-size:11px;

    padding:
      0 5px;
  }

}

</style>

</head>


<body>


<div class="app">


  <!-- =================================================
       HEADER
  ================================================== -->

  <header class="header">

    <div class="header-top">


      <div class="logo-area">

        <div class="logo">
          🏠
        </div>


        <div class="title-area">

          <h1>
            পরিবার হিসাব
          </h1>

          <p>
            পরিবারের সহজ ও দ্রুত হিসাব
          </p>

        </div>

      </div>


      <button
        class="clear-btn"
        onclick="clearAll()">

        Clear All

      </button>


    </div>

  </header>



  <!-- =================================================
       CONTENT
  ================================================== -->

  <main class="content">


    <!-- =================================================
         SUMMARY
    ================================================== -->

    <section class="summary">


      <div class="summary-card">

        <div class="summary-icon">
          👨‍👩‍👧‍👦
        </div>


        <div class="summary-info">

          <div class="summary-label">
            মোট পরিবার
          </div>

          <div
            class="summary-number"
            id="totalFamilies">
            0
          </div>

        </div>

      </div>



      <div class="summary-card">

        <div class="summary-icon">
          👥
        </div>


        <div class="summary-info">

          <div class="summary-label">
            মোট সদস্য
          </div>

          <div
            class="summary-number"
            id="totalMembers">
            0
          </div>

        </div>

      </div>


    </section>



    <!-- =================================================
         TABLE
    ================================================== -->

    <section class="table-card">


      <div class="table-title">


        <div class="table-title-left">

          <div class="table-title-icon">
            📋
          </div>

          <div class="table-title-text">
            পরিবারের তালিকা
          </div>

        </div>


        <div class="table-hint">
          Enter চাপুন
        </div>


      </div>



      <div class="table-wrapper">


        <table>


          <thead>

            <tr>

              <th>
                পরিবারের নাম
              </th>

              <th>
                সদস্য
              </th>

              <th>
                কাজ
              </th>

            </tr>

          </thead>


          <tbody
            id="familyTableBody">
          </tbody>


        </table>


      </div>


    </section>



    <div class="footer">
      তথ্য স্বয়ংক্রিয়ভাবে সংরক্ষিত হয়
    </div>


  </main>


</div>



<script>


/* =====================================================
   STORAGE
===================================================== */

const STORAGE_KEY =
  "poribarHisabSimpleV1";


let families = [];



/* =====================================================
   LOAD DATA
===================================================== */

function loadData(){

  try{

    const saved =
      localStorage.getItem(
        STORAGE_KEY
      );


    if(saved){

      const data =
        JSON.parse(saved);


      if(Array.isArray(data)){

        families =
          data
          .filter(function(item){

            return item &&
                   typeof item === "object";

          })
          .map(function(item){

            return {

              name:
                item.name || "",

              members:
                item.members ??
                ""

            };

          });

      }

    }

  }catch(error){

    families = [];

  }


  render();

}



/* =====================================================
   SAVE
===================================================== */

function saveData(){

  localStorage.setItem(

    STORAGE_KEY,

    JSON.stringify(families)

  );

}



/* =====================================================
   UPDATE NAME
===================================================== */

function updateName(
  index,
  value
){

  if(!families[index]){
    return;
  }


  families[index].name =
    value;


  saveData();

  updateSummary();

}



/* =====================================================
   UPDATE MEMBERS
===================================================== */

function updateMembers(
  index,
  value
){

  if(!families[index]){
    return;
  }


  families[index].members =
    value;


  saveData();

  updateSummary();

}



/* =====================================================
   NAME ENTER
===================================================== */

function nameEnter(
  event,
  index
){

  if(event.key !== "Enter"){
    return;
  }


  event.preventDefault();


  const memberInputs =
    document.querySelectorAll(
      ".member-input"
    );


  if(memberInputs[index]){

    memberInputs[index].focus();

  }

}



/* =====================================================
   MEMBER ENTER
===================================================== */

function memberEnter(
  event,
  index
){

  if(event.key !== "Enter"){
    return;
  }


  event.preventDefault();


  if(!families[index]){
    return;
  }


  const name =
    String(
      families[index].name || ""
    ).trim();


  const members =
    families[index].members;


  /*
    নাম না থাকলে
    নামের ঘরে ফিরে যাবে
  */

  if(!name){

    const nameInputs =
      document.querySelectorAll(
        ".family-name-input"
      );


    if(nameInputs[index]){

      nameInputs[index].focus();

    }

    return;

  }


  /*
    সদস্য সংখ্যা না থাকলে
    একই ঘরে থাকবে
  */

  if(
    members === "" ||
    members === null ||
    members === undefined
  ){

    return;

  }


  /*
    নতুন Row
  */

  families.push({

    name:"",

    members:""

  });


  saveData();

  render();


  /*
    নতুন Row-এর নামের ঘরে
    কার্সর যাবে
  */

  setTimeout(function(){

    const nameInputs =
      document.querySelectorAll(
        ".family-name-input"
      );


    if(nameInputs.length){

      nameInputs[
        nameInputs.length - 1
      ].focus();

    }

  },30);

}



/* =====================================================
   DELETE
===================================================== */

function deleteFamily(index){

  if(
    index < 0 ||
    index >= families.length
  ){

    return;

  }


  families.splice(
    index,
    1
  );


  saveData();

  render();

}



/* =====================================================
   CLEAR ALL
===================================================== */

function clearAll(){

  const hasData =
    families.some(function(item){

      return (
        String(item.name || "").trim() !== "" ||
        String(item.members || "").trim() !== ""
      );

    });


  if(!hasData){

    return;

  }


  const confirmed =
    confirm(
      "সব পরিবারের তথ্য মুছে যাবে।\n\nআপনি কি নিশ্চিত?"
    );


  if(!confirmed){

    return;

  }


  families = [];


  saveData();

  render();

}



/* =====================================================
   CREATE INPUT
===================================================== */

function createInput(
  type,
  index,
  value
){

  const input =
    document.createElement(
      "input"
    );


  if(type === "name"){

    input.type = "text";

    input.className =
      "family-name-input";

    input.placeholder =
      "পরিবারের নাম";

    input.value =
      value || "";


    input.autocomplete =
      "off";


    input.oninput =
      function(){

        updateName(
          index,
          this.value
        );

      };


    input.onkeydown =
      function(event){

        nameEnter(
          event,
          index
        );

      };

  }


  if(type === "member"){

    input.type = "number";

    input.className =
      "member-input";

    input.inputMode =
      "numeric";

    input.min = "0";

    input.placeholder =
      "০";

    input.value =
      value ?? "";


    input.oninput =
      function(){

        updateMembers(
          index,
          this.value
        );

      };


    input.onkeydown =
      function(event){

        memberEnter(
          event,
          index
        );

      };

  }


  return input;

}



/* =====================================================
   RENDER
===================================================== */

function render(){

  const tbody =
    document.getElementById(
      "familyTableBody"
    );


  tbody.innerHTML = "";


  /*
    যদি কোনো ডেটা না থাকে,
    তাহলে প্রথম খালি Row তৈরি হবে।
  */

  if(families.length === 0){

    createNewRow(tbody);

    updateSummary();

    return;

  }


  /*
    পুরোনো Row
  */

  families.forEach(
    function(item,index){

      const row =
        document.createElement(
          "tr"
        );


      /* NAME */

      const nameCell =
        document.createElement(
          "td"
        );


      const nameInput =
        createInput(
          "name",
          index,
          item.name
        );


      nameCell.appendChild(
        nameInput
      );


      /* MEMBERS */

      const memberCell =
        document.createElement(
          "td"
        );


      const memberInput =
        createInput(
          "member",
          index,
          item.members
        );


      memberCell.appendChild(
        memberInput
      );


      /* DELETE */

      const deleteCell =
        document.createElement(
          "td"
        );


      deleteCell.className =
        "delete-cell";


      const deleteButton =
        document.createElement(
          "button"
        );


      deleteButton.className =
        "delete-btn";


      deleteButton.textContent =
        "Delete";


      deleteButton.onclick =
        function(){

          deleteFamily(index);

        };


      deleteCell.appendChild(
        deleteButton
      );


      row.appendChild(
        nameCell
      );


      row.appendChild(
        memberCell
      );


      row.appendChild(
        deleteCell
      );


      tbody.appendChild(
        row
      );

    }
  );


  /*
    সবসময় শেষে একটি নতুন খালি Row
    থাকবে যাতে দ্রুত নতুন পরিবার
    লেখা যায়।
  */

  createNewRow(tbody);


  updateSummary();

}



/* =====================================================
   CREATE NEW EMPTY ROW
===================================================== */

function createNewRow(tbody){

  const row =
    document.createElement(
      "tr"
    );


  row.className =
    "new-row";


  /*
    NAME CELL
  */

  const nameCell =
    document.createElement(
      "td"
    );


  const nameInput =
    document.createElement(
      "input"
    );


  nameInput.type =
    "text";


  nameInput.className =
    "family-name-input";


  nameInput.placeholder =
    "নতুন পরিবারের নাম";


  nameInput.autocomplete =
    "off";


  nameInput.onkeydown =
    function(event){

      if(event.key !== "Enter"){
        return;
      }


      event.preventDefault();


      const name =
        this.value.trim();


      if(!name){

        return;

      }


      /*
        নতুন পরিবারের প্রথম তথ্য
      */

      families.push({

        name:name,

        members:""

      });


      saveData();

      render();


      /*
        নতুন তৈরি Row-এর সদস্য ঘরে
        কার্সর যাবে
      */

      setTimeout(function(){

        const memberInputs =
          document.querySelectorAll(
            ".member-input"
          );


        if(memberInputs.length){

          memberInputs[
            memberInputs.length - 1
          ].focus();

        }

      },30);

    };


  nameCell.appendChild(
    nameInput
  );



  /*
    MEMBER CELL
  */

  const memberCell =
    document.createElement(
      "td"
    );


  const memberInput =
    document.createElement(
      "input"
    );


  memberInput.type =
    "number";


  memberInput.className =
    "member-input";


  memberInput.inputMode =
    "numeric";


  memberInput.min =
    "0";


  memberInput.placeholder =
    "সদস্য";


  memberInput.onkeydown =
    function(event){

      if(event.key !== "Enter"){
        return;

      }


      event.preventDefault();


      /*
        খালি নাম হলে নামের ঘরে যাবে
      */

      const name =
        nameInput.value.trim();


      if(!name){

        nameInput.focus();

        return;

      }


      /*
        সদস্য সংখ্যা না থাকলে
        নতুন Row হবে না
      */

      if(this.value === ""){

        return;

      }


      /*
        এই নতুন Row-কে
        স্থায়ী ডেটাতে যোগ করা
      */

      families.push({

        name:name,

        members:this.value

      });


      saveData();

      render();


      /*
        পরের নতুন Row
      */

      setTimeout(function(){

        const inputs =
          document.querySelectorAll(
            ".family-name-input"
          );


        if(inputs.length){

          inputs[
            inputs.length - 1
          ].focus();

        }

      },30);

    };


  memberCell.appendChild(
    memberInput
  );



  /*
    DELETE CELL
  */

  const deleteCell =
    document.createElement(
      "td"
    );


  deleteCell.className =
    "delete-cell";


  deleteCell.innerHTML =
    '<span style="color:#cbd5e1;font-size:13px;">—</span>';



  /*
    ADD ROW
  */

  row.appendChild(
    nameCell
  );


  row.appendChild(
    memberCell
  );


  row.appendChild(
    deleteCell
  );


  tbody.appendChild(
    row
  );

}



/* =====================================================
   SUMMARY
===================================================== */

function updateSummary(){

  /*
    খালি নতুন Row-কে
    পরিবার হিসেবে গণনা করা হবে না।
  */

  const validFamilies =
    families.filter(function(item){

      return (
        String(item.name || "").trim() !== ""
      );

    });


  const totalFamilies =
    validFamilies.length;


  const totalMembers =
    validFamilies.reduce(
      function(total,item){

        return total +
          (
            Number(item.members) || 0
          );

      },
      0
    );


  document.getElementById(
    "totalFamilies"
  ).textContent =
    totalFamilies;


  document.getElementById(
    "totalMembers"
  ).textContent =
    totalMembers;

}



/* =====================================================
   START
===================================================== */

loadData();
