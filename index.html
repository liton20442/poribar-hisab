<!DOCTYPE html>
<html lang="bn">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0">

<meta name="theme-color" content="#2563eb">

<title>পরিবার হিসাব</title>


<style>

*{
  box-sizing:border-box;
}


body{
  margin:0;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Arial,
    sans-serif;

  background:#f3f6fa;

  color:#1f2937;
}


.container{
  max-width:700px;

  margin:auto;

  padding:12px;
}


/* =========================
   TITLE
========================= */

h1{
  text-align:center;

  color:#2563eb;

  margin:6px 0 14px;

  font-size:28px;
}


/* =========================
   CARD
========================= */

.card{
  background:white;

  border-radius:14px;

  padding:12px;

  margin-bottom:14px;

  box-shadow:
    0 2px 8px rgba(0,0,0,.08);
}


/* =========================
   SUMMARY
========================= */

.summary{
  display:grid;

  grid-template-columns:1fr 1fr;

  gap:10px;
}


.summary-box{
  background:#eff6ff;

  border-radius:12px;

  padding:12px 6px;

  text-align:center;
}


.summary-title{
  font-size:15px;

  color:#475569;

  margin-bottom:3px;
}


.summary-number{
  font-size:26px;

  font-weight:700;

  color:#2563eb;
}


/* =========================
   TOP CLEAR BUTTON
========================= */

.top-actions{
  text-align:right;

  margin-bottom:8px;
}


.clear-btn{
  background:#dc2626;

  color:white;

  border:0;

  border-radius:8px;

  padding:9px 15px;

  font-size:15px;

  font-weight:600;

  cursor:pointer;
}


.clear-btn:active{
  transform:scale(.97);
}


/* =========================
   TABLE
========================= */

.table-wrapper{
  width:100%;

  overflow:hidden;

  border-radius:10px;

  border:1px solid #cbd5e1;

  background:white;
}


table{
  width:100%;

  border-collapse:collapse;

  table-layout:fixed;
}


thead th{
  background:#2563eb;

  color:white;

  font-size:16px;

  padding:11px 6px;

  border-right:1px solid
              rgba(255,255,255,.3);
}


thead th:last-child{
  border-right:0;
}


thead th:nth-child(1){
  width:46%;
}


thead th:nth-child(2){
  width:27%;
}


thead th:nth-child(3){
  width:27%;
}


/* =========================
   ROW
========================= */

tbody tr{
  border-bottom:1px solid #e2e8f0;
}


tbody tr:last-child{
  border-bottom:0;
}


/* =========================
   CELLS
========================= */

td{
  padding:0;

  border-right:1px solid #e2e8f0;

  vertical-align:middle;
}


td:last-child{
  border-right:0;
}


/* =========================
   INPUT
========================= */

td input{
  width:100%;

  border:0;

  outline:none;

  background:transparent;

  padding:11px 8px;

  font-size:16px;

  font-family:inherit;

  color:#1f2937;
}


td input:focus{
  background:#eff6ff;

  box-shadow:
    inset 0 0 0 2px #2563eb;
}


/* সদস্য সংখ্যা */

.member-input{
  text-align:center;
}


/* =========================
   DELETE BUTTON
========================= */

.delete-cell{
  text-align:center;

  padding:4px;
}


.delete-btn{
  border:0;

  background:#dc2626;

  color:white;

  border-radius:7px;

  padding:7px 10px;

  font-size:14px;

  cursor:pointer;
}


.delete-btn:active{
  transform:scale(.95);
}


/* =========================
   NEW ROW
========================= */

.new-row td{
  background:#f8fafc;
}


.new-row input{
  color:#64748b;
}


.new-row input:focus{
  color:#1f2937;
}


/* =========================
   MOBILE
========================= */

@media(max-width:480px){

  .container{
    padding:8px;
  }


  h1{
    font-size:25px;

    margin-bottom:12px;
  }


  .summary-box{
    padding:11px 4px;
  }


  .summary-title{
    font-size:14px;
  }


  .summary-number{
    font-size:24px;
  }


  thead th{
    font-size:15px;

    padding:10px 4px;
  }


  td input{
    font-size:16px;

    padding:10px 6px;
  }


  .delete-btn{
    padding:6px 8px;

    font-size:13px;
  }

}

</style>

</head>


<body>


<div class="container">


  <h1>পরিবার হিসাব</h1>


  <!-- =========================
       SUMMARY
  ========================== -->

  <div class="card">

    <div class="summary">


      <div class="summary-box">

        <div class="summary-title">
          মোট পরিবার
        </div>

        <div
          class="summary-number"
          id="totalFamilies">
          0
        </div>

      </div>


      <div class="summary-box">

        <div class="summary-title">
          মোট সদস্য
        </div>

        <div
          class="summary-number"
          id="totalMembers">
          0
        </div>

      </div>


    </div>

  </div>



  <!-- =========================
       TABLE
  ========================== -->

  <div class="card">


    <!-- CLEAR BUTTON -->

    <div class="top-actions">

      <button
        class="clear-btn"
        onclick="clearAll()">

        Clear

      </button>

    </div>


    <div class="table-wrapper">

      <table>


        <thead>

          <tr>

            <th>
              পরিবারের নাম
            </th>

            <th>
              সদস্য সংখ্যা
            </th>

            <th>
              Delete
            </th>

          </tr>

        </thead>


        <tbody id="familyTableBody">

        </tbody>


      </table>

    </div>


  </div>


</div>



<script>


/* =====================================================
   STORAGE
===================================================== */

const STORAGE_KEY =
  "poribarHisabSimpleV1";


let families = [];



/* =====================================================
   LOAD DATA
===================================================== */

function loadData(){

  try{

    const saved =
      localStorage.getItem(
        STORAGE_KEY
      );


    if(saved){

      const data =
        JSON.parse(saved);


      if(Array.isArray(data)){

        families = data;

      }else{

        families = [];

      }

    }else{

      families = [];

    }

  }catch(error){

    families = [];

  }


  render();

}



/* =====================================================
   SAVE DATA
===================================================== */

function saveData(){

  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify(families)
  );

}



/* =====================================================
   UPDATE NAME
===================================================== */

function updateName(
  index,
  value
){

  if(!families[index]){
    return;
  }


  families[index].name =
    value;


  saveData();

  updateSummary();

}



/* =====================================================
   UPDATE MEMBERS
===================================================== */

function updateMembers(
  index,
  value
){

  if(!families[index]){
    return;
  }


  families[index].members =
    value;


  saveData();

  updateSummary();

}



/* =====================================================
   ENTER FROM FAMILY NAME
===================================================== */

function nameEnter(
  event,
  index
){

  if(event.key !== "Enter"){
    return;
  }


  event.preventDefault();


  /*
    পরিবারের নামের পরে
    ডান পাশের সদস্য সংখ্যা ঘরে যাবে
  */

  const memberInputs =
    document.querySelectorAll(
      ".member-input"
    );


  if(memberInputs[index]){

    memberInputs[index].focus();

    return;

  }

}



/* =====================================================
   ENTER FROM MEMBER COUNT
===================================================== */

function memberEnter(
  event,
  index
){

  if(event.key !== "Enter"){
    return;
  }


  event.preventDefault();


  /*
    সদস্য সংখ্যা দেওয়ার পরে
    নতুন Row তৈরি হবে।
  */

  const name =
    families[index]
    ? String(
        families[index].name || ""
      ).trim()
    : "";


  const members =
    families[index]
    ? families[index].members
    : "";


  /*
    নাম এবং সদস্য সংখ্যা দুটোই
    না থাকলে নতুন Row তৈরি হবে না।
  */

  if(!name){

    const nameInputs =
      document.querySelectorAll(
        ".family-name-input"
      );


    if(nameInputs[index]){

      nameInputs[index].focus();

    }

    return;

  }


  if(
    members === "" ||
    members === null ||
    members === undefined
  ){

    return;

  }


  /*
    নতুন পরিবার যোগ
  */

  families.push({

    name:"",

    members:""

  });


  saveData();

  render();


  /*
    নতুন Row-এর পরিবারের নামের
    ঘরে কার্সর
  */

  setTimeout(function(){

    const nameInputs =
      document.querySelectorAll(
        ".family-name-input"
      );


    if(nameInputs.length){

      nameInputs[
        nameInputs.length - 1
      ].focus();

    }

  },50);

}



/* =====================================================
   DELETE FAMILY
===================================================== */

function deleteFamily(index){

  if(
    index < 0 ||
    index >= families.length
  ){

    return;

  }


  families.splice(
    index,
    1
  );


  saveData();

  render();

}



/* =====================================================
   CLEAR ALL
===================================================== */

function clearAll(){

  if(families.length === 0){

    return;

  }


  const confirmClear =
    confirm(
      "সমস্ত পরিবারের তথ্য মুছে যাবে।\n\nআপনি কি নিশ্চিত?"
    );


  if(!confirmClear){

    return;

  }


  families = [];


  saveData();

  render();

}



/* =====================================================
   RENDER
===================================================== */

function render(){

  const tbody =
    document.getElementById(
      "familyTableBody"
    );


  tbody.innerHTML = "";


  /*
    EXISTING ROWS
  */

  families.forEach(
    function(item,index){

      const row =
        document.createElement(
          "tr"
        );


      /* =====================
         NAME
      ===================== */

      const nameCell =
        document.createElement(
          "td"
        );


      const nameInput =
        document.createElement(
          "input"
        );


      nameInput.type =
        "text";


      nameInput.className =
        "family-name-input";


      nameInput.value =
        item.name || "";


      nameInput.placeholder =
        "পরিবারের নাম";


      nameInput.oninput =
        function(){

          updateName(
            index,
            this.value
          );

        };


      nameInput.onkeydown =
        function(event){

          nameEnter(
            event,
            index
          );

        };


      nameCell.appendChild(
        nameInput
      );



      /* =====================
         MEMBERS
      ===================== */

      const memberCell =
        document.createElement(
          "td"
        );


      const memberInput =
        document.createElement(
          "input"
        );


      memberInput.type =
        "number";


      memberInput.className =
        "member-input";


      memberInput.inputMode =
        "numeric";


      memberInput.min =
        "0";


      memberInput.value =
        item.members ?? "";


      memberInput.placeholder =
        "সদস্য";


      memberInput.oninput =
        function(){

          updateMembers(
            index,
            this.value
          );

        };


      memberInput.onkeydown =
        function(event){

          memberEnter(
            event,
            index
          );

        };


      memberCell.appendChild(
        memberInput
      );



      /* =====================
         DELETE
      ===================== */

      const deleteCell =
        document.createElement(
          "td"
        );


      deleteCell.className =
        "delete-cell";


      const deleteButton =
        document.createElement(
          "button"
        );


      deleteButton.className =
        "delete-btn";


      deleteButton.textContent =
        "Delete";


      deleteButton.onclick =
        function(){

          deleteFamily(index);

        };


      deleteCell.appendChild(
        deleteButton
      );



      row.appendChild(
        nameCell
      );


      row.appendChild(
        memberCell
      );


      row.appendChild(
        deleteCell
      );


      tbody.appendChild(
        row
      );

    }
  );



  /*
    সবশেষে একটি খালি নতুন Row
    থাকবে না।
    
    কারণ আপনার চাওয়া অনুযায়ী:
    
    Name → Enter
    Member → Enter
    তারপর নতুন Row।
  */

  updateSummary();

}



/* =====================================================
   SUMMARY
===================================================== */

function updateSummary(){

  const totalFamilies =
    families.length;


  const totalMembers =
    families.reduce(
      function(total,item){

        return total +
          (
            Number(item.members) || 0
          );

      },
      0
    );


  document.getElementById(
    "totalFamilies"
  ).textContent =
    totalFamilies;


  document.getElementById(
    "totalMembers"
  ).textContent =
    totalMembers;

}



/* =====================================================
   START APP
===================================================== */

loadData();


</script>


</body>
</html>
