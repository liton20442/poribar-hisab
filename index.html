<!DOCTYPE html>
<html lang="bn">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1,
maximum-scale=1,
viewport-fit=cover">

<title>পরিবার হিসাব</title>

<link rel="manifest" href="./manifest.json">

<meta name="theme-color" content="#2563eb">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="পরিবার হিসাব">

<style>

*{
box-sizing:border-box;
-webkit-tap-highlight-color:transparent;
}

html,body{
margin:0;
padding:0;
min-height:100%;

font-family:
-apple-system,
BlinkMacSystemFont,
"Noto Sans Bengali",
"Noto Sans",
Arial,
sans-serif;

background:#f3f6fb;
color:#172033;
}

body{
padding-bottom:env(safe-area-inset-bottom);
}

/* HEADER */

.header{
background:linear-gradient(135deg,#2563eb,#1d4ed8);
color:#fff;

padding:
calc(16px + env(safe-area-inset-top))
18px
18px;

box-shadow:0 4px 18px rgba(37,99,235,.22);
}

.header-top{
display:flex;
align-items:center;
justify-content:space-between;
gap:12px;
}

.logo{
width:50px;
height:50px;
border-radius:15px;

background:rgba(255,255,255,.18);

display:flex;
align-items:center;
justify-content:center;

font-size:28px;
flex:none;
}

.title-wrap{
flex:1;
}

.title{
font-size:28px;
font-weight:800;
line-height:1.15;
}

.subtitle{
font-size:15px;
margin-top:5px;
opacity:.9;
}

.clear-btn{
border:1px solid rgba(255,255,255,.35);
background:rgba(255,255,255,.13);

color:#fff;

border-radius:11px;

padding:10px 12px;

font-size:14px;
font-weight:700;
}

/* MAIN */

.container{
max-width:900px;
margin:auto;
padding:16px;
}

/* SUMMARY */

.summary{
display:grid;
grid-template-columns:1fr 1fr;
gap:12px;
margin-bottom:16px;
}

.summary-card{
background:#fff;

border-radius:17px;

padding:17px;

text-align:center;

box-shadow:0 5px 18px rgba(15,23,42,.07);

border:1px solid #e5eaf2;
}

.summary-number{
font-size:30px;
font-weight:800;
color:#2563eb;
line-height:1.1;
}

.summary-label{
font-size:15px;
font-weight:700;
color:#596579;
margin-top:7px;
}

/* TABLE */

.table-card{
background:#fff;

border-radius:18px;

box-shadow:0 5px 20px rgba(15,23,42,.08);

overflow:hidden;

border:1px solid #e5eaf2;
}

.table-head{
display:flex;
align-items:center;
justify-content:space-between;
gap:10px;

padding:15px 16px;

border-bottom:1px solid #e8edf4;
}

.table-title{
font-size:20px;
font-weight:800;
}

/* ENTER BADGE */

.enter-hint{
display:flex;
align-items:center;
gap:6px;

background:#2563eb;
color:#fff;

border-radius:999px;

padding:7px 10px;

font-size:13px;
font-weight:800;

box-shadow:0 4px 12px rgba(37,99,235,.25);
}

.enter-key{
background:#fff;
color:#2563eb;

border-radius:5px;

padding:2px 6px;

font-size:12px;
font-weight:900;
}

/* TABLE */

.table-wrap{
overflow-x:auto;
}

table{
width:100%;
border-collapse:collapse;
min-width:480px;
}

th{
background:#f1f5ff;

color:#1e3a8a;

font-size:17px;
font-weight:800;

padding:13px 10px;

border-bottom:2px solid #dbe5f5;
}

td{
padding:10px;

border-bottom:1px solid #e8edf4;

text-align:center;
}

td:first-child{
text-align:left;
}

/* INPUT */

input{
width:100%;
height:46px;

border:1px solid #cfd8e6;

border-radius:10px;

background:#fff;

padding:8px 11px;

font-size:18px;

color:#172033;

outline:none;

-webkit-appearance:none;
}

input:focus{
border:2px solid #2563eb;
background:#f8fbff;
}

input::placeholder{
color:#9aa6b5;
}

/* FINISH BUTTON */

.finish-btn{
width:100%;
height:40px;

border:0;
border-radius:10px;

background:#dcfce7;
color:#15803d;

font-size:14px;
font-weight:800;
}

/* DELETE */

.delete-btn{
min-width:70px;
height:40px;

border:0;
border-radius:10px;

background:#fee2e2;
color:#b91c1c;

font-size:15px;
font-weight:800;
}

/* FOOTER */

.footer{
text-align:center;

color:#7b8798;

font-size:13px;

padding:18px 0 8px;
}

/* MOBILE */

@media(max-width:600px){

.container{
padding:12px;
}

.header{
padding-left:14px;
padding-right:14px;
}

.title{
font-size:25px;
}

.subtitle{
font-size:14px;
}

.clear-btn{
font-size:13px;
padding:9px 10px;
}

.summary-card{
padding:15px 8px;
}

.summary-number{
font-size:28px;
}

.summary-label{
font-size:14px;
}

.table-title{
font-size:19px;
}

.enter-hint{
font-size:12px;
padding:6px 8px;
}

th{
font-size:16px;
}

input{
font-size:17px;
}

}

/* PWA */

@media(display-mode:standalone){

html,
body{
overscroll-behavior:none;
}

}

</style>

</head>


<body>


<header class="header">

<div class="header-top">

<div class="logo">
🏠
</div>

<div class="title-wrap">

<div class="title">
পরিবার হিসাব
</div>

<div class="subtitle">
পরিবার ও সদস্য সংখ্যা সহজে সংরক্ষণ করুন
</div>

</div>

<button
class="clear-btn"
onclick="clearAll()">

সব মুছুন

</button>

</div>

</header>


<main class="container">


<section class="summary">

<div class="summary-card">

<div
class="summary-number"
id="familyTotal">

0

</div>

<div class="summary-label">
মোট পরিবার সংখ্যা
</div>

</div>


<div class="summary-card">

<div
class="summary-number"
id="memberTotal">

0

</div>

<div class="summary-label">
মোট সদস্য সংখ্যা
</div>

</div>

</section>


<section class="table-card">


<div class="table-head">

<div class="table-title">
পরিবারের তালিকা
</div>

<div class="enter-hint">

<span class="enter-key">
Enter
</span>

<span>
চাপুন
</span>

</div>

</div>


<div class="table-wrap">

<table>

<thead>

<tr>

<th style="width:52%">
পরিবারের নাম
</th>

<th style="width:25%">
সদস্য
</th>

<th style="width:23%">
কাজ
</th>

</tr>

</thead>


<tbody id="familyBody">
</tbody>

</table>

</div>

</section>


<div class="footer">
ডাটা এই ফোনেই স্বয়ংক্রিয়ভাবে সংরক্ষিত থাকবে
</div>


</main>


<script>

const STORAGE_KEY =
"poribarHisabSimpleV1";

let families=[];


/* LOAD */

function loadData(){

try{

const data=
JSON.parse(
localStorage.getItem(STORAGE_KEY)
||"[]"
);

if(Array.isArray(data)){

families=data
.filter(
x=>
x &&
String(x.name||"").trim()!==""
)
.map(x=>({

name:String(x.name||"").trim(),

members:String(x.members||"")
.replace(/\D/g,"")

}));

}

}catch(e){

families=[];

}

}


/* SAVE */

function saveData(){

localStorage.setItem(
STORAGE_KEY,
JSON.stringify(families)
);

}


/* SUMMARY */

function updateSummary(){

document.getElementById(
"familyTotal"
).textContent=families.length;


let total=0;

families.forEach(
x=>{

const n=
parseInt(x.members,10);

if(!isNaN(n)){
total+=n;
}

});


document.getElementById(
"memberTotal"
).textContent=total;

}


/* ONLY NUMBERS */

function onlyNumbers(input){

input.value=
input.value.replace(
/[^0-9]/g,
""
);

}


/* FOCUS MEMBER */

function focusMember(index){

setTimeout(
()=>{

const input=
document.querySelector(
'[data-member-index="'+index+'"]'
);

if(input){

input.focus();

input.setSelectionRange(
input.value.length,
input.value.length
);

}

},
80
);

}


/* FOCUS NEW FAMILY */

function focusNewFamily(){

setTimeout(
()=>{

const input=
document.querySelector(
'[data-new-family="1"]'
);

if(input){

input.focus();

input.setSelectionRange(
input.value.length,
input.value.length
);

}

},
80
);

}


/* FINISH FAMILY */

function finishFamily(index){

const input=
document.querySelector(
'[data-member-index="'+index+'"]'
);

if(input){

onlyNumbers(input);

families[index].members=
input.value;

}


if(
families[index].name.trim()===""
){

return;

}


saveData();

render();

focusNewFamily();

}


/* CREATE INPUT */

function createInput(
value,
type,
index
){

const input=
document.createElement("input");


input.type="text";

input.value=value||"";

input.autocomplete="off";


/* FAMILY NAME */

if(type==="name"){

input.enterKeyHint="next";

input.placeholder=
"পরিবারের নাম লিখুন";


input.addEventListener(
"input",
function(){

families[index].name=
this.value;

saveData();

}
);


input.addEventListener(
"keydown",
function(event){

if(
event.key==="Enter" ||
event.keyCode===13
){

event.preventDefault();

families[index].name=
this.value.trim();

saveData();

focusMember(index);

}

}
);

}


/* MEMBER */

if(type==="member"){

input.enterKeyHint="done";

input.placeholder="সংখ্যা";

input.setAttribute(
"data-member-index",
index
);


/*
   এখানে inputMode=numeric
   ব্যবহার করা হয়নি।

   কারণ iPhone-এর numeric
   keyboard-এ Return/Enter
   থাকে না।
*/


input.addEventListener(
"input",
function(){

onlyNumbers(this);

families[index].members=
this.value;

saveData();

updateSummary();

}
);


input.addEventListener(
"keydown",
function(event){

if(
event.key==="Enter" ||
event.keyCode===13
){

event.preventDefault();

finishFamily(index);

}

}
);

}


return input;

}


/* RENDER */

function render(){

const body=
document.getElementById(
"familyBody"
);

body.innerHTML="";


/* SAVED ROWS */

families.forEach(
(family,index)=>{

const tr=
document.createElement("tr");


/* NAME */

const nameTd=
document.createElement("td");

nameTd.appendChild(
createInput(
family.name,
"name",
index
)
);


/* MEMBER */

const memberTd=
document.createElement("td");

memberTd.appendChild(
createInput(
family.members,
"member",
index
)
);


/* DELETE */

const actionTd=
document.createElement("td");

const deleteBtn=
document.createElement("button");

deleteBtn.className=
"delete-btn";

deleteBtn.textContent=
"মুছুন";

deleteBtn.onclick=
function(){

families.splice(
index,
1
);

saveData();

render();

focusNewFamily();

};


actionTd.appendChild(
deleteBtn
);


tr.append(
nameTd,
memberTd,
actionTd
);

body.appendChild(tr);

}
);


/* NEW ROW */

const tr=
document.createElement("tr");


/* NEW FAMILY */

const nameTd=
document.createElement("td");

const nameInput=
document.createElement("input");

nameInput.type="text";

nameInput.placeholder=
"পরিবারের নাম লিখুন";

nameInput.autocomplete="off";

nameInput.setAttribute(
"data-new-family",
"1"
);

nameInput.enterKeyHint="next";


nameInput.addEventListener(
"keydown",
function(event){

if(
event.key==="Enter" ||
event.keyCode===13
){

event.preventDefault();

const name=
this.value.trim();

if(name===""){

return;

}


/*
   পরিবার যোগ
*/

families.push({

name:name,

members:""

});

saveData();

render();


/*
   নতুন পরিবারের
   সদস্য ঘরে যাওয়া
*/

focusMember(
families.length-1
);

}

}
);


nameTd.appendChild(
nameInput
);


/* NEW MEMBER */

const memberTd=
document.createElement("td");

const memberInput=
document.createElement("input");

memberInput.type="text";

memberInput.placeholder=
"সংখ্যা";

memberInput.autocomplete="off";

memberInput.enterKeyHint="done";


memberInput.addEventListener(
"input",
function(){

onlyNumbers(this);

}
);


memberInput.addEventListener(
"keydown",
function(event){

if(
event.key==="Enter" ||
event.keyCode===13
){

event.preventDefault();


if(
families.length===0
){

return;

}


const index=
families.length-1;


const number=
this.value.trim();


if(number===""){

return;

}


families[index].members=
number;


saveData();

render();

focusNewFamily();

}

}
);


memberTd.appendChild(
memberInput
);


/* ACTION */

const actionTd=
document.createElement("td");

const finishBtn=
document.createElement("button");

finishBtn.className=
"finish-btn";

finishBtn.textContent=
"✓ শেষ";

finishBtn.onclick=
function(){

if(
families.length===0
){

return;

}


const index=
families.length-1;


const number=
memberInput.value.trim();


if(number===""){

return;

}


families[index].members=
number;

saveData();

render();

focusNewFamily();

};


actionTd.appendChild(
finishBtn
);


tr.append(
nameTd,
memberTd,
actionTd
);

body.appendChild(tr);


updateSummary();

}


/* CLEAR */

function clearAll(){

if(
families.length===0
){

return;

}


if(
confirm(
"সব পরিবারের তথ্য মুছে ফেলবেন?"
)
){

families=[];

saveData();

render();

focusNewFamily();

}

}


/* START */

loadData();

render();


/* SERVICE WORKER */

if(
"serviceWorker" in navigator
){

window.addEventListener(
"load",
function(){

navigator.serviceWorker
.register(
"./service-worker.js"
)
.catch(
error=>
console.log(
"Service Worker Error:",
error
)
);

}
);

}

</script>


</body>
</html>
