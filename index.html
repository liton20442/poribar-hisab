<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0,
               maximum-scale=1.0, user-scalable=no,
               viewport-fit=cover">

<meta name="theme-color" content="#2563eb">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="পরিবার হিসাব">

<link rel="manifest" href="./manifest.json">

<title>পরিবার হিসাব</title>

<style>

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    margin:0;
    padding:0;
    min-height:100%;
    font-family:-apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                "Noto Sans Bengali",
                Arial,
                sans-serif;
    background:#f3f6fb;
    color:#172033;
}

body{
    padding:
        env(safe-area-inset-top)
        12px
        env(safe-area-inset-bottom)
        12px;
}

.app{
    width:100%;
    max-width:900px;
    margin:0 auto;
    padding:12px 0 30px;
}

/* Header */

.header{
    background:linear-gradient(135deg,#2563eb,#1d4ed8);
    color:white;
    border-radius:20px;
    padding:22px 18px;
    box-shadow:0 8px 24px rgba(37,99,235,.20);
    margin-bottom:14px;
}

.header-title{
    font-size:29px;
    font-weight:800;
    line-height:1.2;
    margin:0;
}

.header-subtitle{
    font-size:16px;
    margin-top:7px;
    opacity:.92;
}

/* Summary */

.summary{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
    margin-bottom:14px;
}

.summary-card{
    background:white;
    border-radius:17px;
    padding:16px 14px;
    box-shadow:0 3px 12px rgba(0,0,0,.07);
    border:1px solid #e5eaf2;
    text-align:center;
}

.summary-label{
    font-size:16px;
    color:#64748b;
    font-weight:600;
}

.summary-number{
    font-size:31px;
    font-weight:800;
    color:#1d4ed8;
    margin-top:4px;
}

/* Controls */

.controls{
    background:white;
    border-radius:18px;
    padding:14px;
    box-shadow:0 3px 12px rgba(0,0,0,.07);
    border:1px solid #e5eaf2;
    margin-bottom:14px;
}

.control-title{
    font-size:19px;
    font-weight:800;
    margin-bottom:11px;
}

.button-row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}

.btn{
    border:0;
    border-radius:13px;
    min-height:52px;
    padding:10px 12px;
    font-size:17px;
    font-weight:750;
    cursor:pointer;
    touch-action:manipulation;
}

.btn-backup{
    background:#0f766e;
    color:white;
}

.btn-restore{
    background:#7c3aed;
    color:white;
}

.btn-clear{
    width:100%;
    margin-top:10px;
    background:#fee2e2;
    color:#b91c1c;
}

.btn:active{
    transform:scale(.98);
}

/* List */

.list-card{
    background:white;
    border-radius:18px;
    box-shadow:0 3px 12px rgba(0,0,0,.07);
    border:1px solid #e5eaf2;
    overflow:hidden;
}

.list-header{
    padding:16px 14px 12px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    border-bottom:1px solid #e5eaf2;
}

.list-title{
    font-size:21px;
    font-weight:800;
}

.enter-badge{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    background:#dbeafe;
    color:#1d4ed8;
    border:1px solid #93c5fd;
    border-radius:999px;
    padding:7px 11px;
    font-size:14px;
    font-weight:800;
    white-space:nowrap;
}

/* Table */

.table-wrap{
    width:100%;
    overflow-x:auto;
    -webkit-overflow-scrolling:touch;
}

table{
    width:100%;
    border-collapse:collapse;
    table-layout:fixed;
}

th{
    background:#eff6ff;
    color:#1e3a8a;
    font-size:16px;
    font-weight:800;
    padding:12px 8px;
    border-bottom:1px solid #dbeafe;
}

td{
    padding:8px;
    border-bottom:1px solid #e5e7eb;
    vertical-align:middle;
}

th:nth-child(1){
    width:48%;
}

th:nth-child(2){
    width:25%;
}

th:nth-child(3){
    width:27%;
}

/* Inputs */

.family-input,
.member-input{
    width:100%;
    height:52px;
    border:2px solid #d7deea;
    border-radius:11px;
    background:#fff;
    padding:8px 11px;
    font-size:19px;
    color:#111827;
    outline:none;
    -webkit-appearance:none;
    appearance:none;
    box-shadow:none;
}

.family-input:focus,
.member-input:focus{
    border-color:#2563eb;
    box-shadow:0 0 0 3px rgba(37,99,235,.12);
    background:#f8fbff;
}

/*
   সদস্য সংখ্যা ইচ্ছাকৃতভাবে text রাখা হয়েছে।
   এতে iPhone-এর Return/Enter ব্যবহার করা সহজ হয়।
*/
.member-input{
    text-align:center;
    font-weight:700;
}

/* Delete */

.delete-btn{
    width:100%;
    min-height:48px;
    border:0;
    border-radius:11px;
    background:#fee2e2;
    color:#b91c1c;
    font-size:16px;
    font-weight:800;
    cursor:pointer;
    touch-action:manipulation;
}

.delete-btn:active{
    transform:scale(.97);
}

/* New row */

.new-row td{
    background:#f8fafc;
}

.new-row .family-input{
    border-color:#93c5fd;
    background:#f8fbff;
}

.new-row .member-input{
    border-color:#93c5fd;
    background:#f8fbff;
}

/* Empty */

.empty-message{
    text-align:center;
    padding:24px 15px;
    color:#64748b;
    font-size:16px;
}

/* Footer */

.footer{
    text-align:center;
    color:#64748b;
    font-size:14px;
    padding:18px 5px 5px;
}

/* Restore file input hidden */

#restoreFile{
    display:none;
}

/* Small screens */

@media(max-width:480px){

    body{
        padding-left:9px;
        padding-right:9px;
    }

    .header{
        padding:19px 15px;
        border-radius:17px;
    }

    .header-title{
        font-size:26px;
    }

    .header-subtitle{
        font-size:15px;
    }

    .summary-number{
        font-size:28px;
    }

    .list-header{
        align-items:flex-start;
        flex-direction:column;
    }

    .enter-badge{
        font-size:13px;
    }

    th{
        font-size:15px;
    }

    .family-input,
    .member-input{
        font-size:18px;
        height:50px;
    }

    .delete-btn{
        font-size:14px;
    }
}

</style>
</head>

<body>

<div class="app">

    <!-- Header -->

    <div class="header">

        <div class="header-title">
            পরিবার হিসাব
        </div>

        <div class="header-subtitle">
            পরিবার ও সদস্য সংখ্যা সংরক্ষণের সহজ ব্যবস্থা
        </div>

    </div>


    <!-- Summary -->

    <div class="summary">

        <div class="summary-card">

            <div class="summary-label">
                মোট পরিবার সংখ্যা
            </div>

            <div
                class="summary-number"
                id="totalFamilies"
            >
                0
            </div>

        </div>


        <div class="summary-card">

            <div class="summary-label">
                মোট সদস্য সংখ্যা
            </div>

            <div
                class="summary-number"
                id="totalMembers"
            >
                0
            </div>

        </div>

    </div>


    <!-- Backup / Restore -->

    <div class="controls">

        <div class="control-title">
            ডাটা সংরক্ষণ
        </div>

        <div class="button-row">

            <button
                type="button"
                class="btn btn-backup"
                id="backupBtn"
            >
                💾 ব্যাকআপ
            </button>

            <button
                type="button"
                class="btn btn-restore"
                id="restoreBtn"
            >
                ♻️ রিস্টোর
            </button>

        </div>

        <button
            type="button"
            class="btn btn-clear"
            id="clearBtn"
        >
            🗑️ সব মুছুন
        </button>

        <input
            type="file"
            id="restoreFile"
            accept=".json,application/json"
        >

    </div>


    <!-- Family List -->

    <div class="list-card">

        <div class="list-header">

            <div class="list-title">
                পরিবারের তালিকা
            </div>

            <div class="enter-badge">
                ↵ Enter চাপুন
            </div>

        </div>


        <div class="table-wrap">

            <table>

                <thead>

                    <tr>

                        <th>
                            পরিবারের নাম
                        </th>

                        <th>
                            সদস্য সংখ্যা
                        </th>

                        <th>
                            কাজ
                        </th>

                    </tr>

                </thead>

                <tbody id="familyTableBody">
                </tbody>

            </table>

        </div>

    </div>


    <div class="footer">
        আপনার তথ্য এই ফোনের ব্রাউজারে সংরক্ষিত থাকবে।
    </div>

</div>


<script>

/* =========================================================
   পরিবার হিসাব
   সম্পূর্ণ নতুন সংস্করণ
   ========================================================= */


/* ---------------------------------------------------------
   Storage
   --------------------------------------------------------- */

const STORAGE_KEY = "poribarHisabSimpleV2";


/* ---------------------------------------------------------
   Data
   --------------------------------------------------------- */

let families = [];


/* ---------------------------------------------------------
   DOM
   --------------------------------------------------------- */

const tableBody =
    document.getElementById("familyTableBody");

const totalFamilies =
    document.getElementById("totalFamilies");

const totalMembers =
    document.getElementById("totalMembers");

const backupBtn =
    document.getElementById("backupBtn");

const restoreBtn =
    document.getElementById("restoreBtn");

const restoreFile =
    document.getElementById("restoreFile");

const clearBtn =
    document.getElementById("clearBtn");


/* ---------------------------------------------------------
   Load data
   --------------------------------------------------------- */

function loadData(){

    try{

        const saved =
            localStorage.getItem(STORAGE_KEY);

        if(!saved){

            families = [];

            return;
        }

        const parsed =
            JSON.parse(saved);

        if(Array.isArray(parsed)){

            families = parsed
                .filter(item =>
                    item &&
                    (
                        String(item.name || "").trim() !== "" ||
                        String(item.members || "").trim() !== ""
                    )
                )
                .map(item => ({

                    name:
                        String(item.name || ""),

                    members:
                        String(item.members || "")
                            .replace(/\D/g,"")

                }));

        }else{

            families = [];

        }

    }catch(error){

        console.error(error);

        families = [];

    }

}


/* ---------------------------------------------------------
   Save data
   --------------------------------------------------------- */

function saveData(){

    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(families)
    );

}


/* ---------------------------------------------------------
   Summary
   --------------------------------------------------------- */

function updateSummary(){

    let familyCount = 0;

    let memberCount = 0;


    families.forEach(item => {

        const name =
            String(item.name || "").trim();

        const members =
            parseInt(
                String(item.members || "")
                    .replace(/\D/g,""),
                10
            ) || 0;


        if(name !== ""){

            familyCount++;

        }


        memberCount += members;

    });


    totalFamilies.textContent =
        familyCount.toLocaleString("bn-BD");

    totalMembers.textContent =
        memberCount.toLocaleString("bn-BD");

}


/* ---------------------------------------------------------
   Keep only numbers
   --------------------------------------------------------- */

function cleanNumber(value){

    return String(value || "")
        .replace(/\D/g,"");

}


/* ---------------------------------------------------------
   Create input
   --------------------------------------------------------- */

function createInput(
    className,
    value,
    placeholder
){

    const input =
        document.createElement("input");


    input.type = "text";

    input.className = className;

    input.value = value || "";

    input.placeholder = placeholder;

    input.autocomplete = "off";

    input.autocapitalize = "sentences";

    input.spellcheck = false;

    input.enterKeyHint =
        className === "family-input"
            ? "next"
            : "done";


    return input;

}


/* ---------------------------------------------------------
   Focus helper
   --------------------------------------------------------- */

function focusInput(input){

    if(!input) return;


    /*
      প্রথমে selection সরিয়ে cursor শেষে নেওয়া হচ্ছে।
    */

    try{

        input.focus({
            preventScroll:false
        });

    }catch(error){

        input.focus();

    }


    try{

        const length =
            input.value.length;

        input.setSelectionRange(
            length,
            length
        );

    }catch(error){}

}


/* ---------------------------------------------------------
   Render table
   --------------------------------------------------------- */

function render(){

    tableBody.innerHTML = "";


    /*
      Saved rows
    */

    families.forEach(
        (family,index) => {

            const tr =
                document.createElement("tr");


            /* Family */

            const familyTd =
                document.createElement("td");

            const familyInput =
                createInput(
                    "family-input",
                    family.name,
                    "পরিবারের নাম"
                );


            familyInput.dataset.index =
                index;


            familyInput.addEventListener(
                "input",
                function(){

                    families[index].name =
                        this.value;

                    saveData();

                    updateSummary();

                }
            );


            familyInput.addEventListener(
                "keydown",
                function(event){

                    if(event.key === "Enter"){

                        event.preventDefault();

                        event.stopPropagation();


                        const memberInput =
                            tr.querySelector(
                                ".member-input"
                            );

                        focusInput(memberInput);

                    }

                }
            );


            familyTd.appendChild(
                familyInput
            );


            /* Member */

            const memberTd =
                document.createElement("td");

            const memberInput =
                createInput(
                    "member-input",
                    family.members,
                    "সংখ্যা"
                );


            memberInput.inputMode = "text";

            memberInput.dataset.index =
                index;


            memberInput.addEventListener(
                "input",
                function(){

                    const clean =
                        cleanNumber(
                            this.value
                        );


                    if(this.value !== clean){

                        const cursor =
                            this.selectionStart;

                        this.value =
                            clean;

                        try{

                            this.setSelectionRange(
                                cursor - 1,
                                cursor - 1
                            );

                        }catch(error){}

                    }


                    families[index].members =
                        clean;


                    saveData();

                    updateSummary();

                }
            );


            memberInput.addEventListener(
                "keydown",
                function(event){

                    if(event.key === "Enter"){

                        event.preventDefault();

                        event.stopPropagation();


                        families[index].members =
                            cleanNumber(
                                this.value
                            );


                        saveData();

                        updateSummary();


                        addNewFamilyRow(
                            true
                        );

                    }

                }
            );


            memberTd.appendChild(
                memberInput
            );


            /* Delete */

            const actionTd =
                document.createElement("td");

            const deleteBtn =
                document.createElement("button");

            deleteBtn.type = "button";

            deleteBtn.className =
                "delete-btn";

            deleteBtn.textContent =
                "মুছুন";


            deleteBtn.addEventListener(
                "click",
                function(){

                    families.splice(
                        index,
                        1
                    );

                    saveData();

                    render();

                }
            );


            actionTd.appendChild(
                deleteBtn
            );


            tr.appendChild(
                familyTd
            );

            tr.appendChild(
                memberTd
            );

            tr.appendChild(
                actionTd
            );


            tableBody.appendChild(
                tr
            );

        }
    );


    /*
      সবসময় একটি নতুন খালি row থাকবে।
    */

    createNewRow();


    updateSummary();

}


/* ---------------------------------------------------------
   Create new blank row
   --------------------------------------------------------- */

function createNewRow(){

    const tr =
        document.createElement("tr");

    tr.className = "new-row";


    /* Family */

    const familyTd =
        document.createElement("td");

    const familyInput =
        createInput(
            "family-input",
            "",
            "পরিবারের নাম লিখুন"
        );


    familyInput.id =
        "newFamilyInput";


    familyInput.addEventListener(
        "input",
        function(){

            /*
              নতুন row-এর নাম temporary
              DOM-এর মধ্যেই থাকবে।
            */

        }
    );


    familyInput.addEventListener(
        "keydown",
        function(event){

            if(event.key === "Enter"){

                event.preventDefault();

                event.stopPropagation();


                const memberInput =
                    tr.querySelector(
                        ".member-input"
                    );

                focusInput(memberInput);

            }

        }
    );


    familyTd.appendChild(
        familyInput
    );


    /* Member */

    const memberTd =
        document.createElement("td");

    const memberInput =
        createInput(
            "member-input",
            "",
            "সংখ্যা লিখুন"
        );


    memberInput.id =
        "newMemberInput";


    memberInput.addEventListener(
        "input",
        function(){

            this.value =
                cleanNumber(
                    this.value
                );

        }
    );


    memberInput.addEventListener(
        "keydown",
        function(event){

            if(event.key === "Enter"){

                event.preventDefault();

                event.stopPropagation();


                finishNewRow();

            }

        }
    );


    memberTd.appendChild(
        memberInput
    );


    /* Finish button */

    const actionTd =
        document.createElement("td");

    const finishBtn =
        document.createElement("button");

    finishBtn.type = "button";

    finishBtn.className =
        "delete-btn";

    finishBtn.style.background =
        "#dcfce7";

    finishBtn.style.color =
        "#166534";

    finishBtn.textContent =
        "✓ শেষ";


    finishBtn.addEventListener(
        "click",
        function(){

            finishNewRow();

        }
    );


    actionTd.appendChild(
        finishBtn
    );


    tr.appendChild(
        familyTd
    );

    tr.appendChild(
        memberTd
    );

    tr.appendChild(
        actionTd
    );


    tableBody.appendChild(
        tr
    );

}


/* ---------------------------------------------------------
   Finish new row
   --------------------------------------------------------- */

function finishNewRow(){

    const familyInput =
        document.getElementById(
            "newFamilyInput"
        );

    const memberInput =
        document.getElementById(
            "newMemberInput"
        );


    if(!familyInput || !memberInput){

        return;

    }


    const name =
        familyInput.value.trim();


    const members =
        cleanNumber(
            memberInput.value
        );


    /*
      একদম খালি হলে কিছু করা হবে না।
    */

    if(name === "" && members === ""){

        focusInput(familyInput);

        return;

    }


    /*
      পরিবার নাম না থাকলে শুধু member সংখ্যা
      save করা হবে না।
    */

    if(name === ""){

        alert(
            "আগে পরিবারের নাম লিখুন।"
        );

        focusInput(familyInput);

        return;

    }


    families.push({

        name:name,

        members:members

    });


    saveData();

    render();


    /*
      নতুন খালি পরিবারের ঘরে cursor।
    */

    setTimeout(
        function(){

            const newInput =
                document.getElementById(
                    "newFamilyInput"
                );

            focusInput(newInput);

        },
        50
    );

}


/* ---------------------------------------------------------
   Add new row helper
   --------------------------------------------------------- */

function addNewFamilyRow(
    focusNewInput
){

    const familyInput =
        document.getElementById(
            "newFamilyInput"
        );

    const memberInput =
        document.getElementById(
            "newMemberInput"
        );


    if(
        !familyInput ||
        !memberInput
    ){

        render();

        return;

    }


    const name =
        familyInput.value.trim();


    const members =
        cleanNumber(
            memberInput.value
        );


    /*
      যদি নতুন row-এ কিছু লেখা থাকে,
      সেটি save করা হবে।
    */

    if(name !== ""){

        families.push({

            name:name,

            members:members

        });

        saveData();

    }


    render();


    if(focusNewInput){

        setTimeout(
            function(){

                const input =
                    document.getElementById(
                        "newFamilyInput"
                    );

                focusInput(input);

            },
            50
        );

    }

}


/* ---------------------------------------------------------
   Backup
   --------------------------------------------------------- */

function backupData(){

    /*
      খালি নতুন row Backup-এ যাবে না।
    */

    const backupFamilies =
        families
            .filter(item =>
                String(item.name || "").trim() !== ""
            )
            .map(item => ({

                name:
                    String(item.name || "")
                        .trim(),

                members:
                    cleanNumber(
                        item.members
                    )

            }));


    const backup = {

        app:"পরিবার হিসাব",

        version:2,

        exportedAt:
            new Date().toISOString(),

        data:backupFamilies

    };


    const json =
        JSON.stringify(
            backup,
            null,
            2
        );


    const blob =
        new Blob(
            [json],
            {
                type:"application/json"
            }
        );


    const url =
        URL.createObjectURL(blob);


    const date =
        new Date();


    const year =
        date.getFullYear();


    const month =
        String(
            date.getMonth() + 1
        ).padStart(2,"0");


    const day =
        String(
            date.getDate()
        ).padStart(2,"0");


    const fileName =
        "পরিবার-হিসাব-" +
        year +
        "-" +
        month +
        "-" +
        day +
        ".json";


    const link =
        document.createElement("a");


    link.href = url;

    link.download = fileName;

    document.body.appendChild(link);

    link.click();

    link.remove();


    setTimeout(
        function(){

            URL.revokeObjectURL(url);

        },
        1000
    );

}


/* ---------------------------------------------------------
   Restore button
   --------------------------------------------------------- */

function openRestore(){

    restoreFile.value = "";

    restoreFile.click();

}


/* ---------------------------------------------------------
   Restore file
   --------------------------------------------------------- */

restoreFile.addEventListener(
    "change",
    function(){

        const file =
            this.files &&
            this.files[0];


        if(!file){

            return;

        }


        const reader =
            new FileReader();


        reader.onload =
            function(event){

                try{

                    const backup =
                        JSON.parse(
                            event.target.result
                        );


                    let restored = null;


                    /*
                      নতুন Backup format
                    */

                    if(
                        backup &&
                        backup.data &&
                        Array.isArray(
                            backup.data
                        )
                    ){

                        restored =
                            backup.data;

                    }


                    /*
                      যদি পুরোনো simple array
                      হয়
                    */

                    else if(
                        Array.isArray(
                            backup
                        )
                    ){

                        restored =
                            backup;

                    }


                    if(!restored){

                        throw new Error(
                            "Invalid backup"
                        );

                    }


                    const cleaned =
                        restored
                            .filter(item =>
                                item &&
                                String(
                                    item.name || ""
                                ).trim() !== ""
                            )
                            .map(item => ({

                                name:
                                    String(
                                        item.name || ""
                                    ).trim(),

                                members:
                                    cleanNumber(
                                        item.members
                                    )

                            }));


                    if(
                        !confirm(
                            "এই Backup রিস্টোর করলে বর্তমান তালিকা পরিবর্তন হবে।\n\nরিস্টোর করতে OK চাপুন।"
                        )
                    ){

                        return;

                    }


                    families =
                        cleaned;


                    saveData();

                    render();


                    alert(
                        "Backup সফলভাবে রিস্টোর হয়েছে।"
                    );


                    setTimeout(
                        function(){

                            const input =
                                document.getElementById(
                                    "newFamilyInput"
                                );

                            focusInput(input);

                        },
                        100
                    );


                }catch(error){

                    console.error(error);

                    alert(
                        "এই ফাইলটি সঠিক পরিবার হিসাব Backup নয়।"
                    );

                }

            };


        reader.onerror =
            function(){

                alert(
                    "Backup ফাইল পড়া যায়নি।"
                );

            };


        reader.readAsText(file);

    }
);


/* ---------------------------------------------------------
   Clear all
   --------------------------------------------------------- */

function clearAll(){

    if(
        families.length === 0
    ){

        return;

    }


    const ok =
        confirm(
            "আপনি কি এই তালিকার সব পরিবার মুছে ফেলতে চান?\n\nএর আগে Backup নিয়ে রাখা ভালো।"
        );


    if(!ok){

        return;

    }


    families = [];


    saveData();

    render();


    setTimeout(
        function(){

            const input =
                document.getElementById(
                    "newFamilyInput"
                );

            focusInput(input);

        },
        50
    );

}


/* ---------------------------------------------------------
   Buttons
   --------------------------------------------------------- */

backupBtn.addEventListener(
    "click",
    backupData
);


restoreBtn.addEventListener(
    "click",
    openRestore
);


clearBtn.addEventListener(
    "click",
    clearAll
);

loadData();

){

            navigator.serviceWorker

                )
                .catch(

                        console.log(

                    }
