<!DOCTYPE html>
<html lang="bn">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1,
               maximum-scale=1,
               viewport-fit=cover">

<title>পরিবার হিসাব</title>

<link rel="manifest" href="./manifest.json">

<meta name="theme-color" content="#2563eb">

<meta name="apple-mobile-web-app-capable"
      content="yes">

<meta name="apple-mobile-web-app-status-bar-style"
      content="default">

<meta name="apple-mobile-web-app-title"
      content="পরিবার হিসাব">


<style>

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,
body{
  margin:0;
  padding:0;
  min-height:100%;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Noto Sans Bengali",
    "Noto Sans",
    Arial,
    sans-serif;

  background:#f3f6fb;
  color:#172033;
}

body{
  padding-bottom:env(safe-area-inset-bottom);
}


/* =========================
   HEADER
========================= */

.header{

  background:
    linear-gradient(
      135deg,
      #2563eb,
      #1d4ed8
    );

  color:#fff;

  padding:
    calc(16px + env(safe-area-inset-top))
    18px
    18px;

  box-shadow:
    0 4px 18px
    rgba(37,99,235,.22);
}

.header-top{

  display:flex;
  align-items:center;
  justify-content:space-between;

  gap:12px;
}

.logo{

  width:50px;
  height:50px;

  border-radius:15px;

  background:
    rgba(255,255,255,.18);

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:28px;

  flex:none;
}

.title-wrap{
  flex:1;
}

.title{

  font-size:28px;
  font-weight:800;
  line-height:1.15;
}

.subtitle{

  font-size:15px;
  margin-top:5px;
  opacity:.9;
}

.clear-btn{

  border:
    1px solid
    rgba(255,255,255,.35);

  background:
    rgba(255,255,255,.13);

  color:#fff;

  border-radius:11px;

  padding:10px 12px;

  font-size:14px;
  font-weight:700;
}


/* =========================
   MAIN
========================= */

.container{

  max-width:900px;

  margin:auto;

  padding:16px;
}


/* =========================
   SUMMARY
========================= */

.summary{

  display:grid;

  grid-template-columns:
    1fr 1fr;

  gap:12px;

  margin-bottom:16px;
}

.summary-card{

  background:#fff;

  border-radius:17px;

  padding:17px;

  text-align:center;

  box-shadow:
    0 5px 18px
    rgba(15,23,42,.07);

  border:
    1px solid #e5eaf2;
}

.summary-number{

  font-size:30px;

  font-weight:800;

  color:#2563eb;

  line-height:1.1;
}

.summary-label{

  font-size:15px;

  font-weight:700;

  color:#596579;

  margin-top:7px;
}


/* =========================
   TABLE CARD
========================= */

.table-card{

  background:#fff;

  border-radius:18px;

  box-shadow:
    0 5px 20px
    rgba(15,23,42,.08);

  overflow:hidden;

  border:
    1px solid #e5eaf2;
}

.table-head{

  display:flex;

  align-items:center;

  justify-content:space-between;

  gap:10px;

  padding:15px 16px;

  border-bottom:
    1px solid #e8edf4;
}

.table-title{

  font-size:20px;

  font-weight:800;
}


/* =========================
   ENTER HINT
========================= */

.enter-hint{

  display:flex;

  align-items:center;

  gap:6px;

  background:#2563eb;

  color:#fff;

  border-radius:999px;

  padding:7px 10px;

  font-size:13px;

  font-weight:800;

  box-shadow:
    0 4px 12px
    rgba(37,99,235,.25);

  animation:pulse 1.8s infinite;
}

.enter-key{

  background:#fff;

  color:#2563eb;

  border-radius:5px;

  padding:2px 6px;

  font-size:12px;

  font-weight:900;
}

@keyframes pulse{

  0%,100%{
    transform:scale(1);
  }

  50%{
    transform:scale(1.04);
  }

}


/* =========================
   TABLE
========================= */

.table-wrap{
  overflow-x:auto;
}

table{

  width:100%;

  border-collapse:collapse;

  min-width:480px;
}

th{

  background:#f1f5ff;

  color:#1e3a8a;

  font-size:17px;

  font-weight:800;

  padding:13px 10px;

  border-bottom:
    2px solid #dbe5f5;
}

td{

  padding:10px;

  border-bottom:
    1px solid #e8edf4;

  text-align:center;
}

td:first-child{
  text-align:left;
}


/* =========================
   INPUT
========================= */

input{

  width:100%;

  height:46px;

  border:
    1px solid #cfd8e6;

  border-radius:10px;

  background:#fff;

  padding:8px 11px;

  font-size:18px;

  color:#172033;

  outline:none;

  -webkit-appearance:none;
}

input:focus{

  border:
    2px solid #2563eb;

  background:#f8fbff;
}

input::placeholder{
  color:#9aa6b5;
}


/* =========================
   DELETE BUTTON
========================= */

.delete-btn{

  min-width:70px;

  height:40px;

  border:0;

  border-radius:10px;

  background:#fee2e2;

  color:#b91c1c;

  font-size:15px;

  font-weight:800;
}


/* =========================
   FOOTER
========================= */

.footer{

  text-align:center;

  color:#7b8798;

  font-size:13px;

  padding:18px 0 8px;
}


/* =========================
   MOBILE
========================= */

@media(max-width:600px){

  .container{
    padding:12px;
  }

  .header{
    padding-left:14px;
    padding-right:14px;
  }

  .title{
    font-size:25px;
  }

  .subtitle{
    font-size:14px;
  }

  .clear-btn{
    font-size:13px;
    padding:9px 10px;
  }

  .summary-card{
    padding:15px 8px;
  }

  .summary-number{
    font-size:28px;
  }

  .summary-label{
    font-size:14px;
  }

  .table-title{
    font-size:19px;
  }

  .enter-hint{
    font-size:12px;
    padding:6px 8px;
  }

  th{
    font-size:16px;
  }

  input{
    font-size:17px;
  }

}


/* =========================
   PWA MODE
========================= */

@media(display-mode:standalone){

  html,
  body{
    overscroll-behavior:none;
  }

}

</style>

</head>


<body>


<header class="header">

  <div class="header-top">

    <div class="logo">
      🏠
    </div>


    <div class="title-wrap">

      <div class="title">
        পরিবার হিসাব
      </div>

      <div class="subtitle">
        পরিবার ও সদস্য সংখ্যা সহজে সংরক্ষণ করুন
      </div>

    </div>


    <button
      class="clear-btn"
      onclick="clearAll()">

      সব মুছুন

    </button>

  </div>

</header>



<main class="container">


  <!-- SUMMARY -->

  <section class="summary">

    <div class="summary-card">

      <div
        class="summary-number"
        id="familyTotal">

        0

      </div>

      <div class="summary-label">
        মোট পরিবার সংখ্যা
      </div>

    </div>


    <div class="summary-card">

      <div
        class="summary-number"
        id="memberTotal">

        0

      </div>

      <div class="summary-label">
        মোট সদস্য সংখ্যা
      </div>

    </div>

  </section>



  <!-- FAMILY TABLE -->

  <section class="table-card">


    <div class="table-head">

      <div class="table-title">
        পরিবারের তালিকা
      </div>


      <div class="enter-hint">

        <span class="enter-key">
          Enter
        </span>

        <span>
          চাপুন
        </span>

      </div>

    </div>



    <div class="table-wrap">

      <table>

        <thead>

          <tr>

            <th style="width:52%">
              পরিবারের নাম
            </th>

            <th style="width:25%">
              সদস্য
            </th>

            <th style="width:23%">
              কাজ
            </th>

          </tr>

        </thead>


        <tbody id="familyBody">
        </tbody>

      </table>

    </div>

  </section>


  <div class="footer">
    ডাটা এই ফোনেই স্বয়ংক্রিয়ভাবে সংরক্ষিত থাকবে
  </div>


</main>



<script>


/* =========================
   STORAGE
========================= */

const STORAGE_KEY =
  "poribarHisabSimpleV1";


let families = [];

let newFamilyName = "";


/* =========================
   LOAD DATA
========================= */

function loadData(){

  try{

    const saved =
      JSON.parse(
        localStorage.getItem(
          STORAGE_KEY
        ) || "[]"
      );


    if(Array.isArray(saved)){

      families =
        saved

        .filter(
          item =>
            item &&
            String(
              item.name || ""
            ).trim() !== ""
        )

        .map(item => ({

          name:
            String(
              item.name || ""
            ).trim(),

          members:
            String(
              item.members || ""
            ).replace(
              /\D/g,
              ""
            )

        }));

    }

  }

  catch(error){

    families = [];

  }

}


/* =========================
   SAVE
========================= */

function saveData(){

  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify(
      families
    )
  );

}


/* =========================
   SUMMARY
========================= */

function updateSummary(){

  document
    .getElementById(
      "familyTotal"
    )
    .textContent =
      families.length;


  let total = 0;


  families.forEach(
    family => {

      const number =
        parseInt(
          family.members,
          10
        );


      if(!isNaN(number)){

        total += number;

      }

    }
  );


  document
    .getElementById(
      "memberTotal"
    )
    .textContent =
      total;

}


/* =========================
   EXISTING INPUT
========================= */

function makeInput(
  value,
  type,
  index
){

  const input =
    document.createElement(
      "input"
    );


  /*
    গুরুত্বপূর্ণ:
    type="text"

    এখানে inputMode="numeric"
    ব্যবহার করছি না।

    কারণ iPhone-এর numeric
    keyboard-এ Enter/Return
    থাকে না।
  */

  input.type = "text";

  input.value =
    value || "";


  input.autocomplete =
    "off";


  /* =====================
     MEMBER
  ===================== */

  if(type === "member"){

    input.oninput =
      function(){

        /*
          শুধু ০-৯ থাকবে
        */

        this.value =
          this.value.replace(
            /\D/g,
            ""
          );


        families[index].members =
          this.value;


        saveData();

        updateSummary();

      };


    input.onkeydown =
      function(event){

        if(
          event.key === "Enter" ||
          event.keyCode === 13
        ){

          event.preventDefault();


          const number =
            this.value.trim();


          if(number === ""){

            return;

          }


          families[index].members =
            number;


          saveData();


          render();


          /*
            নতুন খালি
            পরিবারের ঘরে যাব
          */

          focusNewName();

        }

      };

  }


  /* =====================
     FAMILY NAME
  ===================== */

  else{

    input.oninput =
      function(){

        families[index].name =
          this.value;


        saveData();

      };


    input.onkeydown =
      function(event){

        if(
          event.key === "Enter" ||
          event.keyCode === 13
        ){

          event.preventDefault();


          const name =
            this.value.trim();


          if(name === ""){

            return;

          }


          families[index].name =
            name;


          saveData();


          render();


          /*
            সদস্য ঘরে Focus
          */

          setTimeout(
            function(){

              const member =
                document.querySelector(
                  '[data-member-row="' +
                  index +
                  '"]'
                );


              if(member){

                member.focus();

              }

            },
            50
          );

        }

      };

  }


  return input;

}


/* =========================
   RENDER
========================= */

function render(){

  const body =
    document.getElementById(
      "familyBody"
    );


  body.innerHTML = "";


  /* =====================
     SAVED ROWS
  ===================== */

  families.forEach(
    (family,index) => {

      const tr =
        document.createElement(
          "tr"
        );


      /* FAMILY NAME */

      const nameTd =
        document.createElement(
          "td"
        );


      nameTd.appendChild(
        makeInput(
          family.name,
          "name",
          index
        )
      );


      /* MEMBER */

      const memberTd =
        document.createElement(
          "td"
        );


      const memberInput =
        makeInput(
          family.members,
          "member",
          index
        );


      memberInput.setAttribute(
        "data-member-row",
        index
      );


      memberTd.appendChild(
        memberInput
      );


      /* DELETE */

      const actionTd =
        document.createElement(
          "td"
        );


      const deleteButton =
        document.createElement(
          "button"
        );


      deleteButton.className =
        "delete-btn";


      deleteButton.textContent =
        "মুছুন";


      deleteButton.onclick =
        function(){

          families.splice(
            index,
            1
          );


          saveData();

          render();

          focusNewName();

        };


      actionTd.appendChild(
        deleteButton
      );


      tr.append(
        nameTd,
        memberTd,
        actionTd
      );


      body.appendChild(tr);

    }
  );


  /* =====================
     NEW BLANK ROW
  ===================== */

  const newRow =
    document.createElement(
      "tr"
    );


  /* NEW FAMILY NAME */

  const newNameTd =
    document.createElement(
      "td"
    );


  const newNameInput =
    document.createElement(
      "input"
    );


  newNameInput.type =
    "text";


  newNameInput.placeholder =
    "পরিবারের নাম লিখুন";


  newNameInput.autocomplete =
    "off";


  newNameInput.value =
    newFamilyName;


  newNameInput.oninput =
    function(){

      newFamilyName =
        this.value;

    };


  newNameInput.onkeydown =
    function(event){

      if(
        event.key === "Enter" ||
        event.keyCode === 13
      ){

        event.preventDefault();


        const name =
          this.value.trim();


        if(name === ""){

          return;

        }


        /*
          নতুন পরিবার যোগ
        */

        families.push({

          name:name,

          members:""

        });


        newFamilyName =
          "";


        saveData();


        render();


        /*
          নতুন পরিবারের
          সদস্য ঘরে Focus
        */

        setTimeout(
          function(){

            const inputs =
              document.querySelectorAll(
                '[data-member-row]'
              );


            const last =
              inputs[
                inputs.length - 1
              ];


            if(last){

              last.focus();

            }

          },
          50
        );

      }

    };


  newNameTd.appendChild(
    newNameInput
  );


  /* =====================
     NEW MEMBER
  ===================== */

  const newMemberTd =
    document.createElement(
      "td"
    );


  const newMemberInput =
    document.createElement(
      "input"
    );


  /*
    এখানে type=text রাখা হয়েছে।

    ফলে iPhone-এর সাধারণ
    keyboard-এ Return/Enter
    থাকবে।

    কিন্তু oninput-এর মাধ্যমে
    শুধু সংখ্যা গ্রহণ করা হবে।
  */

  newMemberInput.type =
    "text";


  newMemberInput.placeholder =
    "সংখ্যা";


  newMemberInput.autocomplete =
    "off";


  newMemberInput.oninput =
    function(){

      /*
        শুধু ০-৯
      */

      this.value =
        this.value.replace(
          /\D/g,
          ""
        );

    };


  newMemberInput.onkeydown =
    function(event){

      if(
        event.key === "Enter" ||
        event.keyCode === 13
      ){

        event.preventDefault();


        const number =
          this.value.trim();


        if(number === ""){

          return;

        }


        /*
          শেষ পরিবারের
          সদস্য সংখ্যা বসানো
        */

        if(
          families.length > 0 &&
          families[
            families.length - 1
          ].members === ""
        ){

          families[
            families.length - 1
          ].members =
            number;


          saveData();


          newFamilyName =
            "";


          render();


          /*
            আবার নতুন
            পরিবারের নামের ঘরে যাব
          */

          focusNewName();

        }

      }

    };


  newMemberTd.appendChild(
    newMemberInput
  );


  /* NEW ACTION */

  const newActionTd =
    document.createElement(
      "td"
    );


  const dash =
    document.createElement(
      "span"
    );


  dash.textContent =
    "—";


  dash.style.color =
    "#94a3b8";


  dash.style.fontSize =
    "18px";


  newActionTd.appendChild(
    dash
  );


  newRow.append(
    newNameTd,
    newMemberTd,
    newActionTd
  );


  body.appendChild(
    newRow
  );


  updateSummary();

}


/* =========================
   FOCUS NEW FAMILY
========================= */

function focusNewName(){

  setTimeout(
    function(){

      const rows =
        document.querySelectorAll(
          "#familyBody tr"
        );


      const lastRow =
        rows[
          rows.length - 1
        ];


      if(lastRow){

        const input =
          lastRow.querySelector(
            "input"
          );


        if(input){

          input.focus();

        }

      }

    },
    80
  );

}


/* =========================
   CLEAR ALL
========================= */

function clearAll(){

  if(
    families.length === 0
  ){

    return;

  }


  if(
    confirm(
      "সব পরিবারের তথ্য মুছে ফেলবেন?"
    )
  ){

    families = [];

    newFamilyName = "";


    saveData();

    render();

    focusNewName();

  }

}


/* =========================
   START APP
========================= */

loadData();

render();


/* =========================
   SERVICE WORKER
========================= */

if(
  "serviceWorker" in navigator
){

  window.addEventListener(
    "load",
    function(){

      navigator.serviceWorker
        .register(
          "./service-worker.js"
        )
        .catch(
          function(error){

            console.log(
              "Service Worker Error:",
              error
            );

          }
        );

    }
  );

}

</script>


</body>
</html>
